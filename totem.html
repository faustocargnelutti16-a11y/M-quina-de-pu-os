  const prender=function(v){
    const n=Math.round(N_LUCES*Math.min(1,v/999));
    if(n===prendidas)return; prendidas=n;
    luces.forEach(function(l){
      l.el.className=l.i<n?(l.i>=N_LUCES-2?'on alto':'on'):'';
    });
  };

  app.appendChild(o);
  /* EL MARCADOR DE ARRIBA SE AGRANDA.
     El recuadro "#1 DE LA NOCHE" del totem y este marcador son el mismo
     objeto: el golpe arranca desde el recuadro y vuela al centro. Se calcula
     con offsetLeft/offsetTop, que son medidas del maquetado y no se enteran
     de que la tele esta girada. Si algo falla, queda el sacudon de siempre. */
  try{
    const h=$('#recuadro'), pan=$('.gPanel',o);
    if(h&&pan&&pan.animate&&h.offsetWidth){
      let x=0,y=0,e=pan;
      while(e&&e!==o){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}
      if(e===o){
        const sx=h.offsetWidth/pan.offsetWidth, sy=h.offsetHeight/pan.offsetHeight;
        const dx=(h.offsetLeft+h.offsetWidth/2)-(x+pan.offsetWidth/2);
        const dy=(h.offsetTop+h.offsetHeight/2)-(y+pan.offsetHeight/2);
        pan.style.animation='none';
        pan.animate([
          {transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',opacity:.55},
          {transform:'scale(1.05)',opacity:1,offset:.78},
          {transform:'none',opacity:1}
        ],{duration:520,easing:'cubic-bezier(.2,.9,.25,1)'});
      }
    }
  }catch(e){}
  /* El nombre en UNA linea. Se mide con scrollWidth (el totem esta girado:
     getBoundingClientRect daria el ancho cambiado por el alto). */
  const nom=$('.gNom',o), tope=o.clientWidth*0.94;
  let f=parseFloat(getComputedStyle(nom).fontSize), guarda=0;
  while(nom.scrollWidth>tope&&f>10&&guarda++<40){f*=0.94;nom.style.fontSize=f+'px';}

  let rompio=false;
  const glitch=function(v){
    rompio=true;
    fa.poner(v); fb.poner(v);
    grande.poner(v,'#FFFFFF');
    o.classList.add('glitch');
    const et=$('.gRecEt',o); et.textContent='NUEVO RÉCORD'; et.classList.add('nuevo');
    recordSonido();
    setTimeout(function(){
      if(!o.isConnected)return;
      o.classList.remove('glitch');
      grande.poner(null,'#FFD518');
    },720);
  };

  /* Cuenta desde 000. Rapido al principio y frenando al final, como un
     marcador de verdad. Un golpe fuerte tarda un poco mas en subir. */
  const DUR=Math.min(1500,500+score*1.25);
  const t0=performance.now(); let tics=0;
  const paso=function(ahora){
    if(!o.isConnected)return;
    const k=Math.min(1,(ahora-t0)/DUR);
    const v=Math.round(score*(1-Math.pow(1-k,3)));
    grande.poner(v); prender(v);
    if(rompio)rec.poner(v);
    const t=Math.floor(v/45); if(t>tics){tics=t;ticSonido();}
    if(esRec&&!rompio&&previo>0&&v>previo)glitch(v);
    if(k<1)requestAnimationFrame(paso); else terminar();
  };
  const terminar=function(){
    grande.poner(score); prender(score);
    if(esRec&&!rompio)glitch(score);
    if(rompio)rec.poner(score,'#FFD518');
    const sc=$('.gSc',o); sc.textContent=hit.ctx||rango(score); sc.classList.add('rango');
    const fin=$('.gFin',o);
    if(esRec){
      fin.innerHTML=
        '<div class="gGrande" style="color:var(--oro)">¡NUEVO RÉCORD!</div>'+
        '<div class="gChico">NUEVO CAMPEÓN DE LA CASA</div>'+
        (previo>0?'<div class="gChico" style="color:var(--suave)">LE GANÓ AL '+previo+'</div>':'')+
        '<div class="gChico" style="color:var(--suave);font-size:calc(1.7 * var(--u))">FILMALO Y SUBILO A IG</div>';
    }else if(pos===1){
      /* Destronar vale mas que ganar: se nombra al que perdio el puesto. */
      const antes=info.antes;
      const quien=(antes&&!mismaPersona(antes.nombre,hit.nombre))?esc(antes.nombre):'';
      fin.innerHTML=
        '<div class="gGrande" style="color:var(--oro)">¡#1 DE LA NOCHE!</div>'+
        (quien?'<div class="gChico">LE SACÓ EL PUESTO A '+quien+'</div>'
              :'<div class="gChico">VA GANANDO LA BIRRITA</div>')+
        '<div class="gOtra">¿OTRA?</div>';
    }else if(pos>0){
      const pr=proximoRango(score);
      fin.innerHTML=
        '<div class="gGrande" style="color:var(--oro)">ENTRASTE #'+pos+'</div>'+
        '<div class="gChico">DE LA NOCHE</div>'+
        (pr?'<div class="gChico" style="color:var(--suave);font-size:calc(1.8 * var(--u))">A '+pr.falta+' DE '+pr.nombre+'</div>':'')+
        '<div class="gOtra">¿OTRA?</div>';
    }else{
      const pr=proximoRango(score);
      fin.innerHTML=
        '<div class="gChico" style="margin-top:0">TE FALTARON</div>'+
        '<div class="gGrande" style="color:var(--rojo);font-size:calc(7 * var(--u))">'+Math.max(1,faltan)+
          ' <span style="color:#fff;font-size:calc(3 * var(--u))">'+(Math.max(1,faltan)===1?'PUNTO':'PUNTOS')+'</span></div>'+
        '<div class="gChico" style="color:var(--suave);font-size:calc(1.8 * var(--u))">PARA ENTRAR AL TOP'+
          (pr?' · A '+pr.falta+' DE '+pr.nombre:'')+'</div>'+
        '<div class="gOtra">¿OTRA?</div>';
    }
    fin.classList.add('ve');
    fin.querySelectorAll('.gGrande,.gChico').forEach(function(e){
      let g=parseFloat(getComputedStyle(e).fontSize), n=0;
      while(e.scrollWidth>tope&&g>10&&n++<40){g*=0.94;e.style.fontSize=g+'px';}
    });
    if(esRec||pos>0)papeles();
  };
  requestAnimationFrame(paso);

  golpeReloj=setTimeout(function(){
    golpeReloj=null; o.remove();
    /* Si mientras tanto entro otra capa (la ruleta, el rey), el totem sigue
       ocupado: no se libera la rotacion por debajo de ella. */
    if($('.over'))return;
    S.ocupado=false;
    despuesDelGolpe(hit);
  },esRec?T.recordCierra:T.revancha);
}

/* IMPACTO -> ESTATUS -> OTRA.
   Termina el golpe y el totem no vuelve a girar al azar: se para en la
   tabla de la noche, en la pagina donde quedo el que pego, con su renglon
   latiendo. Es el premio de verdad -verse en la tele- y lo ve todo el bar.
   Nueve segundos despues salen los precios con "VAMOS POR OTRA": el que
   pego sigue parado al lado de la maquina, con el celular en la mano. */
function despuesDelGolpe(hit){
  const idx=(S.rk.noche||[]).findIndex(function(e){return mismaPersona(e.nombre,hit.nombre);});
  if(idx>=0){
    S.resaltar={nombre:hit.nombre,hasta:Date.now()+T.tab+1500};
    S.tab=0; S.pag=Math.floor(idx/FILAS_VISIBLES);
    S.congela=Date.now()+T.tab;
    pintarTabs(); pintarRanking();
  }
  setTimeout(function(){
    if(typeof abrirPacks==='function')abrirPacks(true);
  },idx>=0?T.tab:600);
}

function overRevancha(hit,pos,faltan){
  overGolpe(hit,{pos:pos,faltan:faltan,previo:S.record.score,antes:(S.rk.noche||[])[0]||null});
}

/* El apodo lo escribe la gente en el celular: nunca entra crudo al HTML. */
function esc(t){return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .split('"').join('&quot;');}

/* ────────── la ruleta, en vivo en el tótem ──────────
   El orden tiene que ser IDÉNTICO al de RULETA en pinas.js y al de GAJOS en
   carga.html: el servidor manda el número de gajo y acá solo se dibuja.
   No se copia la ruedita del celular a propósito: a cuatro metros nadie lee
   los gajos de una rueda chica. Lo que sí se lee de lejos es un nombre
   gigante cambiando cada vez más lento hasta frenar. */
/* Los mismos gajos que el celular y el mismo orden que RULETA en pinas.js:
   el servidor manda el número de gajo y acá solo se dibuja. */
const GAJOS=[
  {t:'$100.000',premio:1,tope:1},
  {t:'SEGUÍ\nPARTICIPANDO'},
  {t:'COMBO DE\nFERNET',premio:1,tope:1},
  {t:'SEGUÍ\nPARTICIPANDO'},
  {t:'2 BIRRITAS',premio:1},
  {t:'SEGUÍ\nPARTICIPANDO'},
  {t:'DEVOLUCIÓN\n$2.000',premio:1},
  {t:'SEGUÍ\nPARTICIPANDO'},
  {t:'BIRRITA\nGRATIS',premio:1},
  {t:'SEGUÍ\nPARTICIPANDO'},
  {t:'TIRO\nGRATIS',premio:1},
  {t:'SEGUÍ\nPARTICIPANDO'}
];
const NG=GAJOS.length, ARCO=360/NG;

/* La misma rueda que ve el que la gira en la mano, dibujada grande. */
let ruedaLista=null;
function armarRueda(){
  /* Armarla son 150 elementos. Se arma una vez y despues se clona, que es
     instantaneo: en el aparato del bar armarla en el momento hacia que la
     rueda apareciera cuando en el celular ya casi habia terminado. */
  if(ruedaLista)return ruedaLista.cloneNode(true);
  ruedaLista=armarRuedaDeCero();
  return ruedaLista.cloneNode(true);
}
function armarRuedaDeCero(){
  const ns='http://www.w3.org/2000/svg',C=160,R=132;
  const el=(n,a)=>{const e=document.createElementNS(ns,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const r=document.createElementNS(ns,'svg');
  r.setAttribute('viewBox','0 0 320 320');
  r.id='ruedaTv';
  const defs=el('defs',{});
  defs.innerHTML='<radialGradient id="profTv" cx="50%" cy="40%" r="62%">'+
    '<stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>'+
    '</radialGradient>';
  r.appendChild(defs);
  r.appendChild(el('circle',{cx:C,cy:C,r:152,fill:'#0a0b11',stroke:'#3a2f10','stroke-width':2}));
  r.appendChild(el('circle',{cx:C,cy:C,r:143,fill:'none',stroke:'#B98D0A','stroke-width':3}));
  GAJOS.forEach((g,i)=>{
    const a0=(-90+i*ARCO)*Math.PI/180,a1=(-90+(i+1)*ARCO)*Math.PI/180;
    r.appendChild(el('path',{
      d:`M${C} ${C} L${C+R*Math.cos(a0)} ${C+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${C+R*Math.cos(a1)} ${C+R*Math.sin(a1)} Z`,
      fill:g.tope?'#6d1114':g.premio?'#8f2226':'#15161c',stroke:'#B98D0A','stroke-width':1.3}));
    const gr=el('g',{transform:`translate(${C} ${C}) rotate(${i*ARCO+ARCO/2-90})`});
    const lineas=g.t.split('\n');
    const fs=g.tope?11.5:g.premio?10.5:9;
    lineas.forEach((ln,k)=>{
      const t=el('text',{x:R-12,y:lineas.length>1?(k?6.5:-4.5):3.5,
        fill:g.tope?'#FFD518':g.premio?'#fff':'#8a909e',
        'font-size':fs,'font-weight':'700','text-anchor':'end',
        'font-family':'Oswald,sans-serif','letter-spacing':'.3'});
      t.textContent=ln;gr.appendChild(t);
    });
    r.appendChild(gr);
  });
  r.appendChild(el('circle',{cx:C,cy:C,r:R,fill:'url(#profTv)','pointer-events':'none'}));
  for(let i=0;i<NG*2;i++){
    const a=(-90+i*ARCO/2)*Math.PI/180,px=C+134*Math.cos(a),py=C+134*Math.sin(a);
    r.appendChild(el('circle',{cx:px,cy:py+1,r:4.2,fill:'#000','fill-opacity':.55}));
    r.appendChild(el('circle',{cx:px,cy:py,r:4.2,fill:'#f2e8c4',stroke:'#6b5405','stroke-width':1.2}));
    r.appendChild(el('circle',{cx:px-1.1,cy:py-1.1,r:1.3,fill:'#fff','fill-opacity':.85}));
  }
  /* Las 24 lamparitas pulsaban cada una por su cuenta, todas al mismo tiempo:
     el resultado se veia igual pero obligaba al navegador a redibujar la rueda
     entera en cada cuadro mientras giraba. Ahora pulsa el grupo: mismo efecto,
     un solo elemento animado. */
  const bulbos=el('g',{'class':'bulbosTv'});
  for(let i=0;i<24;i++){
    const a=(i*15+7.5)*Math.PI/180;
    bulbos.appendChild(el('circle',{cx:C+147*Math.cos(a),cy:C+147*Math.sin(a),r:3.4,fill:'#FFD518'}));
  }
  r.appendChild(bulbos);
  r.appendChild(el('circle',{cx:C,cy:C,r:44,fill:'#05060a',stroke:'#B98D0A','stroke-width':2}));
  return r;
}

function overRuleta(d){
  S.ocupado=true;
  const idx=Math.max(0,Math.min(NG-1,d.gajo|0));
  const pierde=!GAJOS[idx].premio;
  const o=cre('div','over');
  o.style.cssText+='background:rgba(4,5,10,.97)';
  o.style.animation='aparece .35s cubic-bezier(.22,1,.36,1)';
  o.innerHTML=
    '<div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 50% 45%,rgba(255,213,24,.12),transparent 64%)"></div>'+
    '<div style="color:var(--suave);font-weight:700;letter-spacing:calc(.35 * var(--u));font-size:calc(2 * var(--u))">LA RULETA DE</div>'+
    '<div style="font-family:var(--negra);font-size:calc(5 * var(--u));letter-spacing:1px;margin-top:calc(.6 * var(--u));line-height:1">'+esc(d.nombre||'ANÓNIMO')+'</div>'+
    '<div id="ruedaCaja" style="position:relative;margin-top:calc(2.2 * var(--u));width:calc(44 * var(--u));height:calc(44 * var(--u))"></div>'+
    '<div id="ruletaFin" style="min-height:calc(9 * var(--u));margin-top:calc(1.6 * var(--u));text-align:center;opacity:0;transition:opacity .35s"></div>';
  app.appendChild(o);
  const caja=$('#ruedaCaja',o);
  const rueda=armarRueda();
  rueda.style.cssText='width:100%;height:100%;display:block;will-change:transform';
  caja.appendChild(rueda);
  /* la aguja que golpea las clavijas */
  const ag=cre('div','agujaTv');
  ag.innerHTML='<svg viewBox="0 0 30 36" style="width:100%;height:100%">'+
    '<path d="M15 34 L3 6 Q15 0 27 6 Z" fill="#FFD518" stroke="#7a5c00" stroke-width="1.5"/>'+
    '<circle cx="15" cy="8" r="3.4" fill="#7a5c00"/></svg>';
  caja.appendChild(ag);

  /* Misma física que el celular: el rozamiento hace caer la velocidad de a
     poco, nunca en escalones, y el último gajo tarda ~2 s en cruzarse. */
  const VUELTAS=7;
  const dentro=pierde?0.22:0.50;
  const FINAL=360*VUELTAS-idx*ARCO-ARCO*dentro;
  const T=Math.max(5200,(pierde?9800:8200)-(d._menos|0)), REL=5.6, tau=T/REL;
  const K=1-Math.exp(-REL);
  const t0=performance.now();
  let cruceAnt=0;
  function paso(now){
    const t=Math.min(T,now-t0);
    const ang=FINAL*(1-Math.exp(-t/tau))/K;
    rueda.style.transform='rotate('+ang+'deg)';
    const cruce=Math.floor(ang/(ARCO/2));
    if(cruce>cruceAnt){
      cruceAnt=cruce;
      ticSonido();
      ag.classList.add('tic'); setTimeout(()=>ag.classList.remove('tic'),70);
    }
    if(t<T)requestAnimationFrame(paso); else setTimeout(cerrar,420);
  }
  function cerrar(){
    const fin=$('#ruletaFin',o);
    const nom=GAJOS[idx].t.replace(/\n/g,' ');
    fin.innerHTML=pierde
      ? '<div style="font-family:var(--poster);color:#6b7280;font-size:calc(4.6 * var(--u));line-height:1">SEGUÍ PARTICIPANDO</div>'+
        '<div style="color:var(--tenue);font-weight:700;letter-spacing:calc(.25 * var(--u));font-size:calc(1.7 * var(--u));margin-top:calc(.6 * var(--u))">LA RULETA SE GIRA UNA VEZ POR NOCHE</div>'
      : '<div style="font-family:var(--poster);color:var(--oro);font-size:calc(6.2 * var(--u));line-height:1;text-shadow:0 0 calc(3 * var(--u)) rgba(255,213,24,.5)">'+esc(nom)+'</div>'+
        '<div style="color:var(--oro);font-weight:700;letter-spacing:calc(.3 * var(--u));font-size:calc(2 * var(--u));margin-top:calc(.7 * var(--u))">PASÁ POR LA CAJA A BUSCARLO</div>';
    fin.style.opacity='1';
    if(!pierde){campanaSonido();papeles();}
    setTimeout(()=>{o.remove();S.ocupado=false;},pierde?T_FIN_PIERDE:T_FIN_GANA);
  }
  requestAnimationFrame(paso);
}
const T_FIN_GANA=7000, T_FIN_PIERDE=3600;

/* La ruleta manda: si estaba el cartelón del golpe, lo saca y arranca. Tiene
   que verse en el tótem al mismo tiempo que en la mano del que la giró; si
   espera turno, el bar mira una rueda que en el celular ya terminó. */
/* La primera piña de cada persona trae la ruleta pegada: el servidor manda el
   golpe y la ruleta con milisegundos de diferencia. Antes la ruleta borraba
   el golpe al instante y ese puntaje no se veia nunca en grande. Ahora el
   golpe se queda lo justo para leerse (el numero y el puesto) y la rueda
   arranca despues, girando ese mismo tiempo mas rapido: termina a la vez
   que la del celular, que es lo que importa. */
const GOLPE_MINIMO=2600;
function llegaRuleta(d){
  const g=$('.over.golpe');
  const paso=g?Date.now()-(+g.dataset.t||0):GOLPE_MINIMO;
  if(g&&paso<GOLPE_MINIMO){
    const espera=GOLPE_MINIMO-paso;
    const d2=Object.assign({},d,{_menos:espera});
    setTimeout(function(){arrancarRuleta(d2);},espera);
    return;
  }
  arrancarRuleta(d);
}
function arrancarRuleta(d){
  document.querySelectorAll('.over').forEach(function(x){x.remove();});
  if(golpeReloj){clearTimeout(golpeReloj);golpeReloj=null;}
  cerrarPacks();
  S.ocupado=false;
  overRuleta(d);
}

/* ────────── el rey de la noche (premio de las 3) ────────── */
/* Lo importante acá no es el nombre: es la instrucción. Si el que ganó no
   entiende que tiene que ir a la caja, el premio no se retira y la mecánica
   no sirvió para nada. Por eso "ANDÁ A LA CAJA" va tan grande como el nombre
   y se aclara que se pide por el apodo, que es lo único que la caja ve. */
function overRey(d){
  const previa=$('.over'); if(previa)previa.remove();
  S.ocupado=true; recordSonido();
  const o=cre('div','over');
  o.style.cssText+='background:#04050a;animation:estrobo .35s ease 2';
  o.innerHTML=
    '<div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 75% at 50% 40%,rgba(255,213,24,.16),transparent 66%)"></div>'+
    '<div style="display:flex;flex-direction:column;align-items:center;animation:aparece .5s cubic-bezier(.22,1,.36,1);text-align:center">'+
      '<div class="rl" style="color:var(--oro);font-weight:800;letter-spacing:calc(.5 * var(--u));font-size:calc(2.1 * var(--u))">SON LAS '+entrega().label+' · CERRÓ EL RANKING</div>'+
      '<div class="rl" style="font-family:var(--poster);color:#fff;font-size:calc(4.6 * var(--u));line-height:1;margin-top:calc(1.4 * var(--u))">EL REY DE LA NOCHE</div>'+
      '<div class="rl" style="font-family:var(--negra);color:var(--oro);letter-spacing:2px;font-size:calc(7.6 * var(--u));line-height:1;margin-top:calc(1.2 * var(--u));text-shadow:0 0 calc(3.4 * var(--u)) rgba(255,213,24,.45)">'+esc(d.nombre||'ANÓNIMO')+'</div>'+
      '<div class="rl" style="color:var(--suave);font-weight:700;letter-spacing:calc(.3 * var(--u));font-size:calc(2 * var(--u));margin-top:calc(.8 * var(--u))">CON '+(d.score|0)+' PUNTOS</div>'+
      (d.reina
        ? '<div class="rl" style="margin-top:calc(1.6 * var(--u));color:#F1437B;font-weight:800;letter-spacing:calc(.35 * var(--u));font-size:calc(1.9 * var(--u))">REINA DE LA NOCHE · '+
          esc(d.reina.nombre||'')+' CON '+(d.reina.score|0)+' · TAMBIÉN SE LLEVA LA SUYA</div>'
        : '')+
      '<div style="margin-top:calc(2.2 * var(--u));border-top:1px solid #2a2f3c;padding-top:calc(1.8 * var(--u));display:flex;align-items:center;gap:calc(3 * var(--u))">'+
        /* El QR y la instruccion, uno al lado del otro. El QR es la parte
           importante: el codigo no puede salir en la pantalla (lo lee todo el
           bar), asi que el que gano lo tiene que ir a buscar a su propio
           celular. Escanea, y la pagina le contesta a el solo. */
        '<div id="qrRey" style="flex:none;background:#fff;padding:calc(1 * var(--u));border-radius:calc(1 * var(--u));line-height:0"></div>'+
        '<div style="text-align:left">'+
          '<div class="rl2" style="font-family:var(--poster);color:var(--rojo);font-size:calc(4.4 * var(--u));line-height:1">SE GANÓ '+esc(d.premio||'UN PREMIO')+'</div>'+
          '<div class="rl2" style="font-family:var(--negra);color:#fff;letter-spacing:calc(.2 * var(--u));font-size:calc(2.7 * var(--u));margin-top:calc(1 * var(--u))">¿GANASTE? ESCANEÁ ACÁ</div>'+
          '<div class="rl2" style="color:var(--suave);font-weight:700;letter-spacing:calc(.2 * var(--u));font-size:calc(1.8 * var(--u));margin-top:calc(.6 * var(--u))">TE SALE TU CÓDIGO · MOSTRALO EN LA CAJA</div>'+
          '<div class="rl2" style="color:var(--tenue);font-weight:700;letter-spacing:calc(.2 * var(--u));font-size:calc(1.6 * var(--u));margin-top:calc(.5 * var(--u))">O ANDÁ A LA CAJA Y DECÍ TU APODO</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  app.appendChild(o);
  const cajaQR=$('#qrRey',o);
  if(cajaQR){
    const q=qrSVG(CFG.URL_PREMIO||(location.origin+'/premio'),Math.round(UPX*19),2);
    if(q)cajaQR.appendChild(q); else cajaQR.parentNode.removeChild(cajaQR);
  }
  /* Cada renglón en UNA línea. Partido en dos ("ANDÁ A LA CAJA Y DECÍ / TU
     APODO") se lee peor de lejos, que es como se lo lee: desde la barra. Se
     mide el renglón ya dibujado y se lo achica hasta que entre, así funciona
     igual con "NACHO" que con un apodo de 14 letras y en cualquier tele. */
  /* Ojo con medir acá: el tótem está girado 90°, así que getBoundingClientRect
     devuelve la caja YA ROTADA y el ancho sale donde uno espera el alto. Hay
     que usar scrollWidth, que es la medida de maquetado y no mira la rotación.
     Y hay que compararla contra el ancho de la pantalla, no contra el del
     propio renglón: está centrado en una columna flex, así que se ensancha
     con su texto y medirlo contra sí mismo no detecta nada. */
  const achicar=function(sel,tope){
    o.querySelectorAll(sel).forEach(function(e){
      e.style.whiteSpace='nowrap';
      let f=parseFloat(getComputedStyle(e).fontSize), guarda=0;
      while(e.scrollWidth>tope && f>10 && guarda++<40){
        f*=0.94; e.style.fontSize=f+'px';
      }
    });
  };
  achicar('.rl', o.clientWidth*0.94);
  /* Las de abajo comparten el renglon con el QR, asi que su tope no es la
     pantalla entera: es lo que sobra al costado del QR. */
  const anchoQR=cajaQR&&cajaQR.parentNode?cajaQR.offsetWidth+UPX*3:0;
  achicar('.rl2', o.clientWidth*0.94-anchoQR);
  campanaSonido(); papeles();
  setTimeout(function(){o.remove();S.ocupado=false;},T.reyDura);
}

/* Y después del anuncio queda dando vueltas en la rotación de carteles: el
   que llega 3:20 tiene que enterarse igual de que ese premio existe, porque
   es lo que lo hace quedarse la próxima. */
function cardRey(){
  /* Si hay reina y todavía no retiró, se turnan: la mitad de las veces sale
     ella. El que ya retiró deja de ocupar lugar. */
  const pend=[];
  if(S.rey)  pend.push({...S.rey, fem:false});
  if(S.reina)pend.push({...S.reina,fem:true});
  const sinRetirar=pend.filter(x=>!x.entregado);
  const lista=sinRetirar.length?sinRetirar:pend;
  if(!lista.length)return null;
  const r=lista[Math.floor(S.card/2)%lista.length];
  return { ceja:r.fem?'La birrita de las mujeres':'El premio de la noche',
    color:r.fem?'#F1437B':'#FFD518',
    titulo:r.fem?'REINA DE LA NOCHE':'REY DE LA NOCHE', destacado:r.nombre,
    txt: r.entregado
      ? `se llevó ${r.premio} con ${r.score} puntos`
      : `${r.premio} · andá a la caja y decí tu apodo` };
}

function overRecord(hit,previo){
  overGolpe(hit,{record:true,previo:previo,antes:(S.rk.noche||[])[0]||null});
}

/* ────────── entrada de datos ────────── */
function aplicarEstado(e,deCache){
  if(!e)return;
  /* Si el TV Box se reinicia a las 2 AM sin WiFi, antes arrancaba en blanco
     y parecía que no había jugado nadie. Ahora recupera lo último que vio. */
  if(!deCache){ try{ localStorage.setItem('bp_estado',JSON.stringify({e:e,ts:Date.now(),noche:claveNocheLocal()})); }catch(x){} }
  S.rk.noche=e.noche||[]; S.rk.mujeres=e.mujeres||[]; S.rk.historico=e.historico||[];
  if(e.record)S.record={score:e.record.score||0,nombre:e.record.nombre||null};
  if(typeof e.piñas==='number')S.piñas=e.piñas;
  else if(typeof e.pinasHoy==='number')S.piñas=e.pinasHoy;
  /* El rey viaja en el estado, no solo en el aviso: si el TV Box se reinicia
     a las 3:10 tiene que seguir mostrando quién ganó. */
  S.rey=e.rey||null; S.reina=e.reina||null;
  /* Si el aparato se reinicio despues de las 3, se entera por acá y el
     recuadro del QR tiene que quedar igual que si hubiera visto el anuncio. */
  if(typeof pintarQR==='function'){
    const m=!!reyVigente();
    if(m!==qrEnModoPremio){ qrEnModoPremio=m; pintarQR(); }
  }
  pintarRecord(); pintarRanking(); pintarLema();
  /* En la ultima hora el renglon de arriba y el cartel de abajo cuentan la
     misma gente ("FALTAN 2 PERSONAS"). El ranking se repinta al toque, pero
     el cartel esperaba su turno de rotacion: durante unos segundos arriba
     decia 2 y abajo 3, en la misma pantalla. Si cambio la cuenta, el cartel
     se repinta tambien. */
  try{
    const g=personasAnotadas();
    if(S.gentePintada!==undefined&&g!==S.gentePintada&&esUltimaHora())pintarCard();
    S.gentePintada=g;
  }catch(x){}
}
function llegaGolpe(g){
  const previo=S.record.score;
  S.ultimo={nombre:g.nombre,ig:g.ig,score:g.score,ctx:g.ctx}; S.ultimoTs=Date.now();
  S.piñas++;
  pintarTicker();
  if(g.esRecord||(g.score&&g.score>previo)){
    S.record={score:g.score,nombre:g.nombre};
    overRecord(g,previo);
  }else{
    const lista=S.rk.noche;
    const pos=[...lista,{score:g.score,id:'x'}].sort((a,b)=>b.score-a.score).findIndex(x=>x.id==='x')+1;
    /* Lo que falta para entrar es contra el QUINTO, que es el que cierra el
       top 5. Antes se media contra el ultimo de la lista: con siete anotados
       un 612 "quedaba afuera por 1 punto" aunque le faltaran 40. */
    const corte=lista.length>=5?lista[4].score:0;
    overRevancha(g,pos<=5?pos:0,Math.max(1,corte-g.score+1));
  }
}

/* LA TELE DICE SI TIENE LA BARRA.
   La pantalla completa solo se puede pedir con un toque de una persona, y
   se pierde cada vez que la pagina se carga de nuevo -o sea, cada tarde,
   cuando prenden la tele-. Desde afuera no habia forma de saber si esa
   noche alguien habia apretado OK. Ahora la tele lo cuenta al conectarse:
   la version que ve el panel termina en -OK si esta a pantalla completa y
   en -BARRA si no. Solo lo informa la tele (pantalla apaisada): un celular
   que abre el totem no dice nada. No cambia nada del arranque. */
function estadoPantalla(){
  if(DEMO||ESPEJO||!CFG.ROTAR_90)return '';
  const fs=document.fullscreenElement||document.webkitFullscreenElement||
           document.mozFullScreenElement||document.msFullscreenElement;
  return fs?'-OK':'-BARRA';
}

/* ────────── conexión al servidor ────────── */
function conectar(){
  if(typeof EventSource==='undefined')return pollear();
  let es=null,intentos=0,vivo=true;
  const abrir=()=>{
    if(!vivo)return;
    /* nunca dos conexiones a la vez: llegaria cada golpe por duplicado */
    try{if(es)es.close();}catch(e){}
    /* El tótem se presenta. Con esto el panel puede decir si la TELE está
       prendida, que es distinto de si la máquina puede cobrar: el Shelly
       mira la máquina, esta conexión mira la pantalla. El espejo de /vivo
       se identifica aparte para que mirarlo desde el celular no haga creer
       que la tele está encendida. */
    const quien='?quien='+(DEMO?'demo':(ESPEJO?'espejo':'totem'))+'&v='+VERSION+estadoPantalla();
    try{es=new EventSource((CFG.API||'')+'/api/stream'+quien);}catch(e){return reintentar();}
    es.onopen=()=>{intentos=0;S.conexion='vivo';};
    /* En demostracion la conexion se abre igual -asi se prueba de verdad que
       el aparato la sostiene toda la noche- pero los datos reales del bar no
       entran: la pantalla la maneja la demo. */
    /* El panel puede pedir que la pantalla se recargue. Sirve despues de
       subir una version nueva: sin esto la tele sigue con el codigo que
       cargo la ultima vez y hay que ir hasta el bar a recargarla a mano.
       La marca de tiempo en la direccion es para que el navegador no
       conteste con la copia guardada; se respetan los parametros que ya
       tenia (espejo, demo) para que vuelva igual que estaba. En demo no se
       recarga: si un proveedor la esta probando del otro lado del mundo,
       no se le reinicia la prueba de golpe. */
    es.addEventListener('recargar',()=>{
      if(DEMO)return;
      /* Nunca corta una pina en el aire: si hay una animacion corriendo,
         espera a que termine. Antes habia DOS escuchas de este aviso y la
         primera recargaba al instante, asi que la espera no servia. */
      const irse=function(){
        try{
          const p=new URLSearchParams(location.search);
          p.set('v',String(Date.now()));
          location.replace(location.pathname+'?'+p.toString());
        }catch(e){location.reload();}
      };
      if(S.ocupado||S.packsAbierto){setTimeout(irse,12000);return;}
      setTimeout(irse,400);
    });
    es.addEventListener('estado',ev=>{if(DEMO)return;try{aplicarEstado(JSON.parse(ev.data));}catch(e){}});
    es.addEventListener('golpe', ev=>{if(DEMO)return;try{llegaGolpe(JSON.parse(ev.data));}catch(e){}});
    es.addEventListener('record',ev=>{if(DEMO)return;try{llegaGolpe({...JSON.parse(ev.data),esRecord:true});}catch(e){}});
    es.addEventListener('ruleta',ev=>{try{llegaRuleta(JSON.parse(ev.data));}catch(e){}});
    es.addEventListener('rey',   ev=>{try{const d=JSON.parse(ev.data);
      S.rey={nombre:d.nombre,score:d.score,premio:d.premio,entregado:false,ts:Date.now()};
      S.reina=d.reina?{nombre:d.reina.nombre,score:d.reina.score,premio:d.reina.premio,entregado:false}:null;
      qrEnModoPremio=true; pintarQR();
      overRey(d);}catch(e){}});
    es.onerror=()=>{try{es.close();}catch(e){} reintentar();};
  };
  const reintentar=()=>{
    if(!vivo)return; S.conexion='reintentando';
    setTimeout(abrir,Math.min(30000,1000*Math.pow(2,Math.min(intentos++,5))));
  };
  /* Cuando la pantalla completa entra o se cae, la tele vuelve a presentarse
     para que el panel se entere en segundos y no en el proximo reenganche. */
  let avisoFs=null;
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(avisoFs)clearTimeout(avisoFs);
      avisoFs=setTimeout(function(){avisoFs=null;abrir();},4000);
    });
  });
  abrir();
}
function pollear(){
  const traer=()=>fetch((CFG.API||'')+'/api/estado').then(r=>r.json()).then(aplicarEstado).catch(()=>{});
  traer(); setInterval(traer,15000);
}
/* La noche del bar arranca al mediodia (por eso una madrugada del martes
   sigue siendo "la noche del lunes"). Antes del mediodia, es la de ayer. */
function claveNocheLocal(d){
  const c=new Date(d||Date.now());
  if(c.getHours()<12) c.setDate(c.getDate()-1);
  return c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');
}
/* Primero lo último guardado (instantáneo), después lo real del server. */
try{
  const c=JSON.parse(localStorage.getItem('bp_estado')||'null');
  /* Si es de otra noche no sirve: mostraria un ranking viejo como si fuera
     de hoy. Antes esto se decidia solo con "hace menos de 10 horas", pero
     apenas cerraba el bar (por ej. 10 de la manana, unas horas despues del
     cierre) esa cuenta todavia daba menos de 10h y se seguia mostrando el
     ranking de la noche anterior como si fuera el de esta noche. Ahora se
     compara la noche exacta: si cambio la noche, el cache no sirve. */
  if(!DEMO&&c&&c.e&&c.noche===claveNocheLocal()&&(Date.now()-c.ts)<10*3600e3) aplicarEstado(c.e,true);
}catch(x){}
if(!DEMO)fetch((CFG.API||'')+'/api/estado').then(r=>r.json()).then(function(e){aplicarEstado(e);}).catch(()=>{});
conectar();

/* ────────── primer pintado ────────── */
pintarTabs(); pintarRecord(); pintarRanking(); pintarCard(); pintarQR(); pintarTicker();
window.addEventListener('resize',()=>{pintarQR();});

/* Se deja lista de entrada, cuando no hay nadie mirando, asi el primer giro
   de la noche entra igual de rapido que los demas. */
setTimeout(function(){ try{ armarRueda(); }catch(e){} }, 4000);

/* ────────── la demostracion ────────── */
/* Una noche buena del Beerlin, inventada. Los nombres son de fantasia a
   proposito: esta pantalla se la mandamos a gente de afuera y no tiene por
   que ver quien vino al bar. Los puntajes estan armados como los de verdad
   -diferencias chicas arriba, mas grandes abajo- para que la tabla se lea
   como una pelea y no como una lista.
   NADA de esto corre en el bar: solo entra con ?demo=1 en la direccion. */
function arrancarDemo(){
  /* Solo en la demo se agrega la direccion de Google para China. El totem
     del bar NO la carga: su <link> queda exactamente como estaba, que es la
     version que sabemos que anda en la Fire TV. Aca el proveedor prueba la
     placa con la tipografia correcta, y si tampoco le llega, la pagina se
     ve igual con las fuentes de respaldo. */
  try{
    const l=document.createElement('link');
    l.rel='stylesheet'; l.media='print';
    l.onload=function(){ this.media='all';
      try{pintarTabs();pintarRecord();pintarRanking();pintarCard();pintarQR();}catch(e){} };
    l.href='https://fonts.googleapis.cn/css2?family=Archivo+Black&family=Anton'+
           '&family=Oswald:wght@400;500;600;700&family=Grand+Hotel'+
           '&family=Playfair+Display:ital,wght@1,600;1,700&display=swap';
    document.head.appendChild(l);
  }catch(e){}

  /* POCA GENTE, COMO UNA NOCHE DE VERDAD.
     La primera version llenaba las tres tablas con diez nombres inventados.
     Se veia impresionante y era mentira: el Beerlin no tiene diez personas
     anotadas por noche, y una pantalla toda llena tampoco muestra lo unico
     que de verdad hay que mirar -los lugares libres invitando a entrar-.
     Tres, dos y tres: lo que se ve un jueves a las once. */
  const H=[['EL RUSO',812,''],['TATE',794,'@tate.mdz'],['LA COLO',771,'']];
  const F=[['LA COLO',771,''],['SOFI',588,'@sofi']];
  const V=[['NARIGON',947,''],['EL RUSO',812,''],['MECHI',783,'@mechi.k']];
  const arm=function(t){return t.map(function(x,i){
    return {id:'d'+i+x[0],nombre:x[0],score:x[1],ig:x[2]};});};
  aplicarEstado({
    noche:arm(H), mujeres:arm(F), historico:arm(V),
    record:{score:947,nombre:'NARIGON'},
    pinas:9, rey:null, reina:null, ts:Date.now()
  });
  /* UN solo golpe, y se termina. Antes entraba uno cada 21 segundos y la
     pantalla escupia puntajes que nunca pego nadie: mirandola un rato,
     parecia que el bar estaba lleno. Con uno alcanza para que se vea la
     animacion, el sonido y el cartel de abajo -que es lo que hay que
     probar en una placa nueva- sin inventar una noche entera. */
  setTimeout(function(){
    if(S.ocupado||S.packsAbierto)return;
    try{ llegaGolpe({id:'gdemo',nombre:'EL CHINO',apodo:'EL CHINO',
                     score:789,ig:'',sexo:'M',ts:Date.now()}); }catch(e){}
  },14000);
}
if(DEMO) setTimeout(arrancarDemo,600);

/* ────────── pantalla de arranque: pantalla completa + gesto inicial ──────────
   La API de pantalla completa no se puede pedir sola al cargar (los
   navegadores la bloquean si no hubo un toque humano), asi que se engancha
   a esta pantalla: el empleado la toca una vez con el control y de ahi en
   mas queda a pantalla completa toda la noche. El mismo toque destraba el
   video mudo anti-reposo en los navegadores que exigen un gesto para eso. */
(function(){
  const capa=document.getElementById('arranque');
  if(!capa)return;
  if(ESPEJO){ capa.remove(); return; }
  /* Esta pantalla es un cuadro aparte, fuera de #app: si no se gira igual
     que #app, en la TV rotada se leeria de costado justo el cartel que
     hay que tocar primero. */
  if(CFG.ROTAR_90)capa.style.transform='rotate(90deg)';

  const arranco=Date.now();
  let pidiendo=false;
  const enPantallaCompleta=()=>!!(document.fullscreenElement||document.webkitFullscreenElement||
                                  document.mozFullScreenElement||document.msFullscreenElement);
  const esconder=()=>{capa.style.display='none';};

  function pedirPantallaCompleta(){
    const el=document.documentElement;
    const pedir=el.requestFullscreen||el.webkitRequestFullscreen||
                el.mozRequestFullScreen||el.msRequestFullscreen;
    if(!pedir||enPantallaCompleta())return;
    try{const p=pedir.call(el); if(p&&p.catch)p.catch(function(){});}catch(e){}
  }

  /* ═══ NO TOCAR ESTE BLOQUE ═══
     Esto es EXACTAMENTE el codigo que Fausto dejo andando a mano en la Fire
     TV: OK del control -> entra pantalla completa, se va la barra de Silk, y
     el cartel se va solo. Ya se rompio dos veces por reescribirlo "mejor".
     No se reordena, no se refactoriza, no se cambia un setTimeout por otro.
     Si alguna vez hay que tocarlo, se prueba ANTES en la Fire TV de verdad,
     no en un navegador de escritorio: Silk se comporta distinto y ninguna
     prueba de aca lo reproduce. */
  function empezar(){
    if(pidiendo)return;
    pidiendo=true;
    /* Sonido y video se destraban igual: no molestan y si el gesto era de
       verdad, quedan listos. */
    const v=document.getElementById('despierto');
    if(v){try{v.muted=false;v.volume=0.001;const p=v.play();
      if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});});}catch(e){}}
    if(navigator.wakeLock){try{navigator.wakeLock.request('screen');}catch(e){}}
    try{ac();sonidoPrueba();}catch(e){}
    pedirPantallaCompleta();
    setTimeout(esconder,2500);
    document.addEventListener('fullscreenchange',esconder);
    document.addEventListener('webkitfullscreenchange',esconder);
    setTimeout(function(){pidiendo=false;},300);
  }

  /* Cualquier tecla y cualquier toque, en cualquier parte: lo unico que hace
     falta es un gesto humano, no uno en particular. El primer OK tiene que
     entrar SIEMPRE: si no entra, queda la barra del navegador puesta. */
  let ultimoIntento=0;
  ['click','pointerdown','touchstart','keydown'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      /* SE COMIA EL PRIMER OK.
         Aca habia una ventana ciega de 1,2 segundos para descartar los
         eventos que dispara el navegador solo al cargar. Funcionaba de
         casualidad: la pagina tardaba en aparecer, asi que cuando alguien
         llegaba a apretar ya habian pasado los 1,2 s. Cuando las fuentes
         dejaron de trabar el arranque la pantalla empezo a aparecer en
         0,24 s, y el primer OK caia justo adentro de la ventana: se perdia
         y habia que apretar dos veces. El de la barra tocaba una vez, no
         pasaba nada, y quedaba la barra de Silk puesta.
         Lo que habia que filtrar no era "temprano", era "no lo hizo una
         persona" -y para eso esta isTrusted, que es exacto-. Queda una
         ventana minima de 250 ms para el instante mismo de la carga. */
      if(e&&e.isTrusted===false)return;
      if(Date.now()-arranco<250)return;
      if(capa.style.display!=='none'){ empezar(); return; }
      /* El cartel ya no esta: cada toque sigue reintentando la pantalla
         completa por las dudas, callado. Si ya esta, no hace nada. */
      if(Date.now()-ultimoIntento<2000)return;
      ultimoIntento=Date.now();
      pedirPantallaCompleta();
    });
  });

  /* Si el navegador SUELTA una pantalla completa que ya habia entrado (pasa
     cuando el aparato se duerme y vuelve), se reintenta sola. No vuelve a
     aparecer el cartel: el toque siguiente, sea de quien sea, ya la pide. */
  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
    .forEach(function(ev){
      document.addEventListener(ev,function(){
        if(!enPantallaCompleta())setTimeout(pedirPantallaCompleta,600);
      });
    });
})();
</script>
