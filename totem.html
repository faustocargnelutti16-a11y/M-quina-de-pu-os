 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>BeerPunch · Tótem</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Oswald:wght@400;500;600;700&family=Grand+Hotel&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --rojo:#EC1C24; --led:#FF2A2A; --oro:#FFD518; --azul:#3D55B8;
  --rosa:#F1437B; --rosaC:#FF8FB1; --teal:#2DD4BF;
  --texto:#fff; --suave:#D9DEE7; --tenue:#98A1B0;
  --negra:'Archivo Black',Impact,sans-serif;
  --poster:'Anton','Arial Narrow',sans-serif;
  --cuerpo:'Oswald',sans-serif;
  --fem:'Playfair Display',Georgia,serif;
  --borde:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04050a;overflow:hidden;font-family:var(--cuerpo);color:#fff}

#marco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#app{position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:repeating-linear-gradient(180deg,#04050a 0,#04050a 5px,#07080d 5px,#07080d 6px);
  border:1px solid #16181f;transition:transform 2s linear}

/* ═══ cabecera ═══ */
#cab{padding:2.4% 4.5% 0;flex:none}
.fila{display:flex;align-items:center;justify-content:center;gap:2.6%}
#logo{width:calc(6.4 * var(--u));height:calc(6.4 * var(--u));flex:none;object-fit:contain}
.marca{font-family:var(--negra);font-size:calc(4.4 * var(--u));line-height:1;letter-spacing:.5px;white-space:nowrap}
.marca .p{color:var(--rojo)}
#sub{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.3%;gap:8px}
#lema{color:var(--oro);letter-spacing:3px;font-weight:700;font-size:calc(1.95 * var(--u));white-space:nowrap}
#reloj{color:#fff;font-weight:600;letter-spacing:1px;font-size:calc(2.05 * var(--u));white-space:nowrap}
#reloj b{color:var(--oro);font-weight:600}
.regla{height:2px;margin-top:1.3%;border-radius:2px;
  background:linear-gradient(90deg,var(--rojo),transparent 72%)}

/* ═══ récord ═══ */
#recuadro{flex:none;margin:1.7% 4.5% 0;padding:1.7% 4%;border:1px solid rgba(236,28,36,.4);
  border-radius:15px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(236,28,36,.15),rgba(0,0,0,.35) 74%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 54px -14px rgba(236,28,36,.45)}
.et{color:var(--suave);letter-spacing:4.5px;font-weight:700;font-size:calc(2.1 * var(--u))}
#recLed{display:flex;justify-content:center;margin:1% 0;min-height:calc(7.6 * var(--u));align-items:center}
#recNom{font-family:var(--negra);font-size:calc(3.5 * var(--u));letter-spacing:2px;color:#fff}
#recNom span{font-family:var(--cuerpo);font-weight:500;color:var(--suave);font-size:.62em;letter-spacing:1px}
#recPie{color:var(--oro);font-weight:700;letter-spacing:3px;font-size:calc(2.45 * var(--u));margin-top:calc(.4 * var(--u))}

/* ═══ ticker ═══ */
#ticker{flex:none;margin:1.7% 4.5% 0;height:7.4%;border-radius:11px;overflow:hidden;
  background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  display:flex;align-items:center}
#ticker .caja{width:100%;padding:0 4%}
#ticker .top{display:flex;align-items:center;gap:9px}
#ticker .nom{font-family:var(--poster);font-weight:400;letter-spacing:1px;font-size:calc(4.1 * var(--u));white-space:nowrap;flex:none}
#ticker .ig{color:var(--suave);font-weight:600;font-size:calc(1.7 * var(--u));flex:1;min-width:0;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
/* El rango ahora es una chapita al lado del nombre. No se encoge ni se
   parte: o entra entero o no va, porque "PELIGRO..." cortado no dice nada. */
#ticker .ctx{flex:none;color:var(--oro);font-weight:700;letter-spacing:1.2px;
  font-size:calc(1.75 * var(--u));white-space:nowrap;
  border:1px solid rgba(255,213,24,.45);border-radius:999px;
  padding:calc(.15 * var(--u)) calc(.9 * var(--u));line-height:1.25}
#ticker .idle{width:100%;text-align:center;font-weight:700;letter-spacing:3px;font-size:calc(3.1 * var(--u));color:#fff;line-height:1.15}
@keyframes entra{0%{transform:translateX(110%);opacity:0}12%{transform:none;opacity:1}100%{transform:none;opacity:1}}
@keyframes suave{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ═══ ranking ═══ */
#rank{flex:1;margin:1.7% 4.5% 0;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;gap:3px}
#tabs button{flex:1;padding:1.5% 0;border:none;border-radius:9px 9px 0 0;cursor:default;
  font-family:var(--cuerpo);font-weight:700;letter-spacing:1px;font-size:calc(2.1 * var(--u));
  background:rgba(255,255,255,.06);color:var(--tenue)}
#tabs button.on{background:var(--oro);color:#000}
#tabs button.on.fem{background:var(--rosa);color:#fff}
#tabs button.fem{font-family:var(--fem);font-style:italic;font-size:calc(2.25 * var(--u))}
#panel{flex:1;border:1px solid var(--borde);border-top:2px solid var(--oro);border-radius:0 0 13px 13px;
  padding:1.5% 3%;display:flex;flex-direction:column;min-height:0;background:rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 28px -14px rgba(0,0,0,.75)}
#panel.fem{border-top-color:var(--rosa);
  background:radial-gradient(ellipse at 50% 0%,rgba(241,67,123,.1),rgba(0,0,0,.3) 74%)}
#premioEt{text-align:center;padding:1% 2%;margin-bottom:1%;border-radius:9px;
  background:rgba(255,213,24,.09);color:var(--oro);font-weight:700;letter-spacing:1px;font-size:calc(1.95 * var(--u))}
#panel.fem #premioEt{background:rgba(241,67,123,.12);color:var(--rosa);
  font-family:var(--fem);font-style:italic;letter-spacing:.3px;font-size:calc(2.3 * var(--u))}
/* Un solo renglon, siempre. Pasada la hora del premio dice "PREMIO ENTREGADO
   - ARRANCA UNA NOCHE NUEVA" o "GANO FULANO - PASA POR LA CAJA", que son mas
   largos que la cuenta regresiva: se partian en dos lineas, le robaban alto a
   la tabla y la ultima fila quedaba cortada o encimada. Ahora la letra se
   achica hasta que entre (ver pintarRanking) y nunca baja de renglon. */
#cuenta{text-align:center;font-weight:700;letter-spacing:1.8px;font-size:calc(1.95 * var(--u));padding:.4% 0 .8%;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cuenta b{color:var(--oro)}
#cuenta.urge b{color:var(--led)}
#filas{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.fil{display:flex;align-items:center;gap:3%;padding:calc(.55% * var(--apr,1)) 3.5%;border-radius:9px;
  background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  border:1px solid transparent}
.fil.uno{border-color:rgba(255,213,24,.4)}
#panel.fem .fil{border-radius:20px;background:rgba(241,67,123,.06)}
#panel.fem .fil.uno{border-color:rgba(241,67,123,.45)}
.fil .pos{font-family:var(--negra);width:9%;text-align:center;font-size:calc(2.9 * var(--u))}
.fil .dat{flex:1;min-width:0}
.fil .n{display:block;font-family:var(--poster);font-weight:400;letter-spacing:.6px;font-size:calc(3.6 * var(--u));color:#fff;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel.fem .fil .n{font-family:var(--fem);font-style:italic;font-weight:700;letter-spacing:.2px;font-size:calc(3.5 * var(--u))}
.fil .a{display:block;color:var(--suave);font-weight:600;font-size:calc(1.5 * var(--u))}
/* UN LUGAR LIBRE, NO UN HUECO.
   El borde punteado es lo que convierte un renglon vacio en una invitacion:
   es el mismo lenguaje de una silla vacia con un cartel de "reservado". Y va
   al 68% de opacidad, no al 42%: al 42% la tabla entera parecia apagada. */
.fil.vacio{opacity:.68;background:rgba(255,255,255,.02);
  border:1px dashed rgba(255,255,255,.22)}
.fil.vacio .n{color:#8f9bb0;letter-spacing:3px;font-weight:600}
#panel.fem .fil.vacio{border-color:rgba(241,67,123,.3)}
#panel.fem .fil.vacio .n{color:var(--rosaC)}
/* El primero vacio es el que mas vale: se lo pinta de oro y respira. */
.fil.vacio.primero{opacity:.92;border-color:rgba(255,213,24,.5);background:rgba(255,213,24,.05)}
.fil.vacio.primero .n{color:var(--oro)}
#panel.fem .fil.vacio.primero{border-color:rgba(241,67,123,.55);background:rgba(241,67,123,.07)}
#panel.fem .fil.vacio.primero .n{color:var(--rosa)}
/* La palabra que va donde iria el puntaje. Sin ella el renglon queda rengo. */
.fil .libre{font-family:var(--negra);letter-spacing:3px;color:#7b8699;
  border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:.25em .7em;white-space:nowrap}
.fil.vacio.primero .libre{color:var(--oro);border-color:rgba(255,213,24,.45)}
#panel.fem .fil.vacio.primero .libre{color:var(--rosa);border-color:rgba(241,67,123,.5)}
/* El puesto que asoma: un renglon de verdad, mas bajo y mas tenue. Antes era
   un recorte con degradado y en la pantalla real no se apreciaba. */
.fil.asoma{opacity:.4;padding-top:calc(.15% * var(--apr,1));padding-bottom:calc(.15% * var(--apr,1))}
.fil.asoma .pos{color:#4b5563}

/* ═══ zona baja ═══ */
/* EL QR DE CARGA ES EL ELEMENTO QUE MAS PLATA MUEVE DE TODA LA PANTALLA:
   es por donde se paga y por donde la gente deja su nombre en el ranking.
   Estaba en 195 px mientras los QR de la pantalla de precios -que aparecen
   un minuto cada tanto- median 330. Al reves de como tiene que ser. La zona
   de abajo gana un punto y medio de alto y el texto del recuadro se achica:
   los dos van enteros al QR. */
#baja{flex:none;margin:1.7% 4.5%;height:22%;display:flex;gap:3%}
.card{flex:1;min-width:0;border-radius:17px;padding:calc(1.6 * var(--u)) 3.5%;overflow:hidden;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 28px -14px rgba(0,0,0,.75)}
/* Ritmo vertical: cada bloque tiene su propio aire y ninguno se pega al de al
   lado. Antes el gap era porcentual y con textos largos se comía el espacio. */
.card .ceja{letter-spacing:2.2px;font-weight:700;font-size:calc(1.7 * var(--u));text-transform:uppercase;
  margin-bottom:calc(.9 * var(--u));opacity:.95}
.card h2{font-family:var(--poster);font-size:calc(3.5 * var(--u));letter-spacing:.5px;line-height:1.04;
  text-transform:uppercase}
.card .mega{font-family:var(--poster);line-height:1;letter-spacing:1px;margin-top:calc(.6 * var(--u));
  font-size:calc(4.8 * var(--u));text-shadow:0 0 28px currentColor}
.card .fila2{display:flex;align-items:baseline;gap:calc(1.2 * var(--u));flex-wrap:wrap;justify-content:center;
  margin-top:calc(.7 * var(--u))}
.card .big{font-family:var(--poster);font-size:calc(2.7 * var(--u));letter-spacing:.4px;line-height:1}
/* precio viejo tachado: se lee como oferta, no como precio */
.card .antes{font-family:var(--poster);font-size:calc(1.9 * var(--u));line-height:1;
  color:var(--tenue);text-decoration:line-through;text-decoration-thickness:2px}
.card.ap1 .antes{font-size:calc(1.65 * var(--u))}
.card.ap2 .antes{font-size:calc(1.45 * var(--u))}
.card.ap3 .antes{font-size:calc(1.25 * var(--u))}
.card .txt{color:var(--suave);font-weight:600;font-size:calc(1.7 * var(--u));line-height:1.3;margin-top:calc(.9 * var(--u));
  max-width:97%}
/* 14 caracteres en Archivo Black no entran a calc(3.6 * var(--u)): la card mide ~calc(29 * var(--u)) de
   ancho y el texto pedía 31. A calc(2.7 * var(--u)) con el tracking apretado, entra. */
.card .arroba{font-family:var(--negra);font-size:calc(2.7 * var(--u));line-height:1.1;color:#fff;
  letter-spacing:-.3px;white-space:nowrap;margin-top:calc(.6 * var(--u))}
.card .arroba i{font-style:normal;color:var(--rojo)}
/* Red de contencion: si el contenido de una card no entra en la altura de la
   zona baja, se aprieta un escalon, y si sigue sin entrar, dos. Antes se
   recortaba con overflow:hidden y el ultimo renglon quedaba pisado contra el
   borde. Solo se activa cuando desborda: si entra, no cambia nada. */
.card.ap1 .ceja{font-size:calc(1.2 * var(--u));letter-spacing:2px;margin-bottom:calc(.5 * var(--u))}
.card.ap1 h2{font-size:calc(2.6 * var(--u))}
.card.ap1 .mega{font-size:calc(4 * var(--u));margin-top:calc(.35 * var(--u))}
.card.ap1 .big{font-size:calc(2.35 * var(--u))}
.card.ap1 .arroba{font-size:calc(2.35 * var(--u));margin-top:calc(.35 * var(--u))}
.card.ap1 .txt{font-size:calc(1.55 * var(--u));margin-top:calc(.5 * var(--u))}
.card.ap1 .fila2{margin-top:calc(.45 * var(--u));gap:calc(.9 * var(--u))}
.card.ap2 .ceja{font-size:calc(1.05 * var(--u));letter-spacing:1px;margin-bottom:calc(.3 * var(--u))}
.card.ap2 h2{font-size:calc(2.2 * var(--u))}
.card.ap2 .mega{font-size:calc(3.3 * var(--u));margin-top:calc(.2 * var(--u))}
.card.ap2 .big{font-size:calc(2 * var(--u))}
.card.ap2 .arroba{font-size:calc(2 * var(--u));margin-top:calc(.2 * var(--u))}
.card.ap2 .txt{font-size:calc(1.45 * var(--u));margin-top:calc(.35 * var(--u))}
.card.ap2 .fila2{margin-top:calc(.3 * var(--u));gap:calc(.7 * var(--u))}
.card.ap3 .ceja{font-size:calc(.95 * var(--u));letter-spacing:.5px;margin-bottom:calc(.2 * var(--u))}
.card.ap3 h2{font-size:calc(1.85 * var(--u))}
.card.ap3 .mega{font-size:calc(2.7 * var(--u));margin-top:calc(.15 * var(--u))}
.card.ap3 .big{font-size:calc(1.7 * var(--u))}
.card.ap3 .arroba{font-size:calc(1.7 * var(--u));margin-top:calc(.15 * var(--u))}
.card.ap3 .txt{display:none}
.card.ap3 .fila2{margin-top:calc(.25 * var(--u));gap:calc(.5 * var(--u))}
.vivo{display:inline-flex;align-items:center;gap:5px;background:var(--rojo);border-radius:999px;
  padding:2px 10px;font-weight:700;letter-spacing:1px;font-size:calc(1.4 * var(--u))}
.vivo i{width:6px;height:6px;border-radius:999px;background:#fff;animation:pal 1.2s ease-in-out infinite}
@keyframes pal{0%,100%{opacity:1}50%{opacity:.35}}
#qr{flex:none;width:36%;border-radius:17px;padding:1.6% 1.6%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2%;border:1px dashed rgba(45,212,191,.55);
  background:radial-gradient(120% 100% at 50% -20%,rgba(45,212,191,.17),rgba(7,9,16,.75) 66%),#080a12}
#qr svg{background:#fff;border-radius:8px;display:block}
#qr .hueco{flex:1;min-height:56%;width:100%;display:flex;align-items:center;justify-content:center}
#qr .t1{font-family:var(--poster);color:var(--teal);font-size:calc(1.95 * var(--u));line-height:1;margin-top:calc(.25 * var(--u))}
#qr .t2{color:#fff;font-weight:700;font-size:calc(1.3 * var(--u));letter-spacing:.8px;line-height:1.1;margin-top:2px}
/* Durante la hora siguiente al premio, ese mismo recuadro deja de ser el de
   cargar la pina y pasa a ser el de retirar el premio. Cambia de color para
   que se note de lejos que dice otra cosa. */
#qr.premio{border-style:solid;border-color:rgba(255,213,24,.75);
  background:radial-gradient(120% 100% at 50% -20%,rgba(255,213,24,.2),rgba(7,9,16,.75) 66%),#080a12;
  animation:latePremio 2.6s ease-in-out infinite}
#qr.premio .t1{color:var(--oro)}
@keyframes latePremio{0%,100%{box-shadow:0 0 0 0 rgba(255,213,24,.35)}50%{box-shadow:0 0 calc(2.6 * var(--u)) calc(.5 * var(--u)) rgba(255,213,24,.22)}}

/* ═══ overlays ═══ */
.over{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 8%}
@keyframes flash{0%{background:#fff}8%{background:#EC1C24}16%{background:#fff}24%{background:#EC1C24}
  32%{background:#fff}40%{background:#EC1C24}52%{background:#fff}64%{background:#EC1C24}
  100%{background:rgba(4,5,10,.97)}}
@keyframes estrobo{0%,100%{background:#000}50%{background:#EC1C24}}
@keyframes aparece{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes cae{0%{transform:translateY(calc(-5 * var(--u))) rotate(0);opacity:1}
  100%{transform:translateY(calc(105 * var(--u))) rotate(720deg);opacity:.7}}
@keyframes brilla{0%,100%{opacity:1}50%{opacity:.78}}
.papel{position:absolute;top:0;z-index:52;pointer-events:none;border-radius:2px}
#packs{position:absolute;inset:0;z-index:42;display:none;flex-direction:column;padding:4.6% 5% 4%;gap:2.6%;
  background:radial-gradient(120% 60% at 50% -5%,rgba(236,28,36,.18),rgba(4,5,10,.97) 60%),#04050a;
  animation:aparece .45s cubic-bezier(.22,1,.36,1)}
.pk{flex:1;min-width:0;border-radius:18px;padding:calc(2.4 * var(--u)) calc(1.1 * var(--u)) calc(1.1 * var(--u));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:calc(.35 * var(--u));position:relative;border:2px solid}
/* El QR se queda con todo lo que sobra: es lo unico de esta pantalla que la
   gente tiene que poder usar desde la mesa. */
.pk .hueco{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.pk .tag{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);border-radius:999px;
  padding:.35em 1em;white-space:nowrap;font-weight:700;letter-spacing:1.1px;font-size:calc(1.45 * var(--u))}
.pk .cant{font-family:var(--poster);font-size:calc(2.9 * var(--u));letter-spacing:.4px;color:#fff;margin-top:1%}
.pk .prec{font-family:var(--poster);font-size:calc(4.4 * var(--u));line-height:1;color:var(--oro);
  text-shadow:0 0 26px rgba(255,213,24,.35)}
.pk .antesPk{font-size:calc(2.1 * var(--u));color:var(--tenue);text-decoration:line-through;
  text-decoration-thickness:2px;text-shadow:none;white-space:nowrap}
.pk .cu{color:var(--suave);font-weight:600;font-size:calc(1.85 * var(--u))}
.pk svg{background:#fff;border-radius:8px;display:block}
.pk .esc{color:var(--suave);font-weight:700;letter-spacing:1.5px;font-size:calc(1.55 * var(--u))}
@keyframes late{0%,100%{transform:none}50%{transform:scale(1.03)}}
/* resplandor del cartel destacado: respira sin mover nada de lugar */
.pk .aura{position:absolute;inset:0;border-radius:18px;pointer-events:none;
  animation:aura 2.2s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.3}50%{opacity:1}}
.pk .tag.urge{animation:brilla 1.15s ease-in-out infinite}
.qrEnv{position:relative;border-radius:9px;overflow:hidden}
.barrido{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.85) 50%,transparent 66%);
  transform:translateX(-150%)}
/* Los cuatro barridos corrian a la vez y encima arrancaban justo cuando la
   pantalla estaba entrando: en un aparato flojo eso es el tironeo del
   principio. Ahora barre uno por vez y recien cuando termino de aparecer. */
.pk{transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
.pk.foco{transform:scale(1.045);z-index:2}
@keyframes barre{0%{transform:translateX(-150%)}100%{transform:translateX(160%)}}

/* El puño no está quieto: respira, y cada tanto pega.
   perspective + rotateX hacen que venga de atrás hacia adelante. */
#logoCaja{position:relative;flex:none;perspective:420px;display:flex;align-items:center;justify-content:center}
#logo{transform-origin:50% 50%;will-change:transform;animation:respira 3.4s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(1) rotateX(0)}50%{transform:scale(1.045) rotateX(6deg)}}
#logo.pega{animation:impacto .62s cubic-bezier(.18,.9,.24,1)}
@keyframes impacto{
  0%{transform:translateZ(-120px) scale(.62) rotateX(26deg) rotateZ(-9deg)}
  38%{transform:translateZ(90px) scale(1.42) rotateX(-12deg) rotateZ(4deg)}

   pantalla completa, con sonido y moviendose sola un pixel cada tanto para

   Se activa con ?espejo=1 al final de la direccion. No cambia ningun dato:

   inversor o para probar una placa nueva.

const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
(()=>{let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=285;}
  for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
const mul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
function genPoly(n){let p=[1];for(let i=0;i<n;i++){const q=new Array(p.length+1).fill(0);
  for(let j=0;j<p.length;j++){q[j]^=mul(p[j],EXP[i]);q[j+1]^=p[j];}p=q;}return p.reverse();}

    if(f!==0)for(let i=0;i<g.length-1;i++)r[i]^=mul(g[i+1],f);}return r;}
const VER={1:[26,10,1,16,0,0],2:[44,16,1,28,0,0],3:[70,26,1,44,0,0],4:[100,18,2,32,0,0],
  5:[134,24,2,43,0,0],6:[172,16,4,27,0,0],7:[196,18,4,31,0,0],8:[242,22,2,38,2,39],
  9:[292,22,3,36,2,37],10:[346,26,4,43,1,44]};
const ALI={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
function cap(v){const[,,b1,d1,b2,d2]=VER[v];return Math.floor(((b1*d1+b2*d2)*8-4-(v<10?8:16))/8);}
function verPara(n){for(let v=1;v<=10;v++)if(cap(v)>=n)return v;throw new Error('texto muy largo');}
function fmtBits(m){let l=m|0,e=l;for(let i=0;i<10;i++)e=(e<<1)^(((e>>9)&1)*1335);return((l<<10)|e)^21522;}
function verBits(v){let l=v;for(let i=0;i<12;i++)l=(l<<1)^(((l>>11)&1)*7973);return(v<<12)|l;}
function qrMatrix(txt){
  const bytes=new TextEncoder().encode(txt), v=verPara(bytes.length);
  const[,ec,b1,d1,b2,d2]=VER[v], size=17+v*4, bits=[];
  const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1);};
  put(4,4); put(bytes.length,v<10?8:16);
  for(const b of bytes)put(b,8);
  const totalBits=(b1*d1+b2*d2)*8;
  put(0,Math.min(4,totalBits-bits.length));
  while(bits.length%8)bits.push(0);
  const dat=[]; for(let i=0;i<bits.length;i+=8){let n=0;for(let j=0;j<8;j++)n=(n<<1)|bits[i+j];dat.push(n);}
  const pad=[236,17]; let k=0; while(dat.length<totalBits/8)dat.push(pad[k++%2]);
  const blocks=[],ecs=[]; let p=0;
  for(let i=0;i<b1;i++){blocks.push(dat.slice(p,p+d1));p+=d1;}
  for(let i=0;i<b2;i++){blocks.push(dat.slice(p,p+d2));p+=d2;}
  for(const b of blocks)ecs.push(rs(b,ec));
  const final=[],maxL=Math.max(...blocks.map(b=>b.length));
  for(let i=0;i<maxL;i++)for(const b of blocks)if(i<b.length)final.push(b[i]);
  for(let i=0;i<ec;i++)for(const e of ecs)final.push(e[i]);

  const M=Array.from({length:size},()=>new Array(size).fill(null));
  const set=(y,x,v2)=>{if(y>=0&&y<size&&x>=0&&x<size)M[y][x]=v2;};
  const finder=(y,x)=>{for(let i=-1;i<=7;i++)for(let j=-1;j<=7;j++){
    const yy=y+i,xx=x+j; if(yy<0||yy>=size||xx<0||xx>=size)continue;
    const ring=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6));
    const core=i>=2&&i<=4&&j>=2&&j<=4; set(yy,xx,ring||core);}};
  finder(0,0);finder(0,size-7);finder(size-7,0);
  for(let i=8;i<size-8;i++){const on=i%2===0;set(6,i,on);set(i,6,on);}
  for(const a of ALI[v])for(const b of ALI[v]){
    if((a<=8&&b<=8)||(a<=8&&b>=size-9)||(a>=size-9&&b<=8))continue;
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)set(a+i,b+j,Math.max(Math.abs(i),Math.abs(j))!==1);}
  set(size-8,8,true);
  const fijo=Array.from({length:size},(_,y)=>Array.from({length:size},(_,x)=>M[y][x]!==null));
  const res=Array.from({length:size},()=>new Array(size).fill(false));
  for(let i=0;i<9;i++){res[8][i]=true;res[i][8]=true;}
  for(let i=0;i<8;i++){res[8][size-1-i]=true;res[size-1-i][8]=true;}
  if(v>=7)for(let i=0;i<6;i++)for(let j=0;j<3;j++){res[i][size-11+j]=true;res[size-11+j][i]=true;}
  const flujo=[];for(const b of final)for(let i=7;i>=0;i--)flujo.push((b>>i)&1);
  let idx=0,arriba=true;
  for(let col=size-1;col>0;col-=2){
    if(col===6)col--;
    for(let n=0;n<size;n++){
      const y=arriba?size-1-n:n;
      for(let s=0;s<2;s++){const x=col-s;
        if(M[y][x]===null&&!res[y][x])M[y][x]=idx<flujo.length?flujo[idx++]===1:false;}}
    arriba=!arriba;
  }
  const out=M.map((row,y)=>row.map((c,x)=>(fijo[y][x]||res[y][x])?!!c:((y+x)%2===0?!c:!!c)));
  const f=fmtBits(0);
  for(let i=0;i<15;i++){
    const b=((f>>i)&1)===1;
    if(i<6)out[i][8]=b; else if(i<8)out[i+1][8]=b; else out[size-15+i][8]=b;
    if(i<8)out[8][size-1-i]=b; else if(i===8)out[8][7]=b; else out[8][14-i]=b;
  }
  out[size-8][8]=true;
  if(v>=7){const vb=verBits(v);
    for(let i=0;i<18;i++){const on=((vb>>i)&1)===1,a=Math.floor(i/3),b=i%3;
      out[a][size-11+b]=on;out[size-11+b][a]=on;}}
  return out;
}
const cacheQR=new Map();
const cacheDibujo=new Map();
function qrSVG(texto,px,quiet){
  quiet=quiet==null?3:quiet;
  if(!texto)return null;
  /* Dibujar un QR de Mercado Pago son miles de cuadraditos. La pantalla de
     precios se arma cada un minuto y siempre con los mismos cuatro: se
     guarda el dibujo terminado y despues solo se clona, que es instantaneo.
     En un aparato flojo esto es la diferencia entre entrar tironeando o no. */
  const llave=texto+'|'+px+'|'+quiet;
  const guardado=cacheDibujo.get(llave);
  if(guardado)return guardado.cloneNode(true);
  let m=cacheQR.get(texto);
  if(m===undefined){try{m=qrMatrix(texto);}catch(e){m=null;}cacheQR.set(texto,m);}
  if(!m)return null;
  /* Cada cuadradito del QR tiene que medir un numero ENTERO de pixeles. Si
     mide 2,25 px, el navegador redondea cada uno para su lado: unos salen de
     2 px y otros de 3, el dibujo queda rayado y el telefono no lo lee. Los QR
     de Mercado Pago son largos (muchos cuadraditos), asi que es justo donde
     mas se notaba. Achicamos hasta el multiplo entero mas cercano: se pierden
     unos pocos pixeles de lado y se gana un QR que se escanea. */
  const n=m.length,tot=n+quiet*2,c=Math.max(1,Math.floor(px/tot)),lado=c*tot,d=[];
  for(let y=0;y<n;y++){let x=0;while(x<n){
    if(!m[y][x]){x++;continue;}
    let w=1;while(x+w<n&&m[y][x+w])w++;
    d.push(`M${(x+quiet)*c} ${(y+quiet)*c}h${w*c}v${c}h${-w*c}z`);x+=w;}}
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox',`0 0 ${lado} ${lado}`);s.setAttribute('width',lado);s.setAttribute('height',lado);
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d.join(''));p.setAttribute('fill','#000');p.setAttribute('shape-rendering','crispEdges');
  s.appendChild(p);
  if(cacheDibujo.size<24)cacheDibujo.set(llave,s.cloneNode(true));
  return s;
}

const SEG={a:[9,0,42,11],f:[0,7,11,41],b:[49,7,11,41],g:[9,44.5,42,11],

const MAPA={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd',

function led(valor,alturaVh,color){
  const cont=cre('div');
  cont.style.cssText=`display:flex;gap:calc(${alturaVh*.14} * var(--u));transform:skewX(-4deg)`;
  String(valor).split('').forEach(ch=>{

    s.setAttribute('viewBox','0 0 60 100');

      filter:drop-shadow(0 0 calc(${alturaVh/14} * var(--u)) ${color})`;
    for(const k in SEG){const[x,y,w,h]=SEG[k];

/* ───── sonido pensado para un bar CON MÚSICA ─────
   La música de un bar vive abajo de 1 kHz: bombo, bajo, voces. Un sonido
   grave ahí adentro no se escucha, se tapa. Lo que atraviesa es corto y
   agudo, entre 1,5 y 4 kHz, que es donde la música tiene menos energía y el
   oído más sensibilidad. Por eso el tic de la ruleta se escuchaba y el
   golpe no: el golpe era un barrido de 140 a 48 Hz. */
let RUIDO=null;
function ruido(a){
  if(!RUIDO||RUIDO.sampleRate!==a.sampleRate){
    RUIDO=a.createBuffer(1,Math.floor(a.sampleRate*.4),a.sampleRate);
    const d=RUIDO.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const f=a.createBufferSource();f.buffer=RUIDO;return f;
}
/* El impacto: un golpe seco de ruido filtrado en agudos + dos campanitas.
   Se queda un poco de grave para que tenga cuerpo, pero lo que se escucha
   por arriba de la música es la parte de arriba. */
function golpeSonido(){
  const a=ac();if(!a)return;
  const t=a.currentTime;
  const f=ruido(a), bp=a.createBiquadFilter(), gn=a.createGain();
  bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=1.1;
  gn.gain.setValueAtTime(.7,t);
  gn.gain.exponentialRampToValueAtTime(.0001,t+.16);
  f.connect(bp).connect(gn).connect(a.destination);f.start(t);f.stop(t+.2);
  [[1850,.5],[2750,.32]].forEach(([hz,v])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='triangle';o.frequency.value=hz;
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+.32);
  });
  const o=a.createOscillator(),g=a.createGain();   // cuerpo, apenas
  o.type='sine';o.frequency.setValueAtTime(180,t);
  o.frequency.exponentialRampToValueAtTime(70,t+.2);
  g.gain.setValueAtTime(.35,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.26);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+.28);
}

/* El trinquete de la rueda: uno por cada clavija que pasa. Corto y agudo
   para que se escuche por arriba de la musica sin tapar nada. */
function ticSonido(){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=1250;
  g.gain.setValueAtTime(.11,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.05);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.06);
}

/* Llamada de atencion para la pantalla de precios. Tres notas que suben,
   con timbre de metal (sierra filtrada), cortas. Es un "mira para aca", no
   una cancion: en un bar con musica propia, un sonido corto y distinto se
   escucha; una melodia de fondo solo se pelea con la musica del lugar. */
function llamadaSonido(){
  const a=ac();if(!a)return;
  const t=a.currentTime;
  [[523,0,.16],[659,.13,.16],[988,.26,.5]].forEach(([hz,d,dur])=>{
    const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=hz;
    f.type='lowpass';f.frequency.setValueAtTime(5200,t+d);
    f.frequency.exponentialRampToValueAtTime(1400,t+d+dur);
    g.gain.setValueAtTime(.0001,t+d);
    g.gain.exponentialRampToValueAtTime(.34,t+d+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+d+dur);

  });
}

/* El "tac" del foco que recorre los packs. Sube de tono de tarjeta en

  const h=(dia===4||dia===5||dia===6)?4:3;
  const t=new Date(d); if(d.getHours()>=6)t.setDate(t.getDate()+1);
  t.setHours(h,0,0,0);

/* ─── proporción 9:16 + rotación opcional ─── */
/* La unidad de todo el diseno. Antes se usaba "vh", que mide contra el alto de
   la VENTANA. Cuando el totem se gira 90 grados, el alto de la ventana pasa a
   ser el lado corto de la TV (1080) mientras que el totem mide 1920 de alto:
   todo terminaba dibujado al 56% (9/16) del tamano disenado, y el sobrante
   quedaba como espacio muerto entre las cosas. --u siempre vale 1% del alto
   real del totem, este girado o no. En vertical da exactamente lo mismo que
   antes; girado, devuelve el diseno a su tamano real. */
let UPX = window.innerHeight/100;
function fijarUnidad(altoApp){
  UPX = altoApp/100;
  document.documentElement.style.setProperty('--u', UPX+'px');
}
function medir(){
  const W=window.innerWidth,H=window.innerHeight;
  let w,h;
  if(CFG.ROTAR_90){ h=Math.min(H,W*9/16); w=h*16/9;
    app.style.width=h+'px'; app.style.height=w+'px';
    app.style.transform=`rotate(90deg) translate(${S.qx||0}px,${S.qy||0}px)`;
    fijarUnidad(w);
  }else{ h=Math.min(H,W*16/9); w=h*9/16;
    app.style.width=w+'px'; app.style.height=h+'px';
    app.style.transform=`translate(${S.qx||0}px,${S.qy||0}px)`;
    fijarUnidad(h);
  }
}
window.addEventListener('resize',medir); medir();
/* Al entrar a pantalla completa, algunos navegadores de TV sacan la barra
   pero no avisan con un "resize" (o avisan tarde): el cartel quedaba
   calculado con el tamano de antes, mas chico que la pantalla real, y
   todo -incluidos los QR- se veia reducido. Se vuelve a medir apenas
   cambia el modo, y un par de veces mas por si el numero llega tarde. */
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
  .forEach(ev=>document.addEventListener(ev,()=>{
    medir(); pintarQR();
    setTimeout(()=>{medir();pintarQR();},300);
    setTimeout(()=>{medir();pintarQR();},1200);
  }));

/* ─── anti burn-in: 8 h por noche queman el panel ─── */
if(!ESPEJO)setInterval(()=>{S.qx=Math.round((Math.random()-.5)*8);S.qy=Math.round((Math.random()-.5)*8);medir();},T.antiQuema);

/* ─── que el TV Box no se duerma ───
   Dos cinturones. El moderno (Wake Lock) cuando el navegador lo tiene, y
   el de toda la vida: un video mudo en loop, que el aparato interpreta
   como "el tipo esta mirando algo" y no dispara el protector de pantalla
   ni el apagado. Solo con el Wake Lock, en la practica, igual terminaba
   saliendo el fondo de pantalla y apagandose despues de un rato. */
(async function(){if(ESPEJO)return;   // en el celular no hace falta y gasta bateria
  let wl=null;
  const pedir=async()=>{try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen');else return;
    wl.addEventListener('release',()=>{wl=null;});}catch(e){}};
  pedir();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!wl)pedir();});
  /* En un TV Box sin mouse/teclado puede no disparar nunca un cambio de
     visibilidad, asi que ademas se vuelve a pedir cada tanto por las dudas
     de que el navegador lo haya soltado solo sin avisar. */
  setInterval(()=>{if(!wl)pedir();},120000);})();

/* ────────── récord ────────── */
function pintarRecord(){
  /* LA META TIENE QUE SER ALCANZABLE, Y EL LUGAR VACIO TIENE QUE INVITAR.
     Con gente anotada, el numero grande es el #1 de la noche: el que hay
     que pasar para llevarse la birrita. Sin nadie anotado no se muestra un
     hueco ("--- SIN DUEÑO" decia "aca no juega nadie") ni un marcador de
     mentira (unos "???" de siete segmentos se leian como numeros cortados):
     el recuadro dice, grande y solo, TU NOMBRE, con el cursor titilando como
     cuando un arcade te pide las iniciales. El record de la casa va abajo,
     chico: un numero de verdad, de una persona de verdad. */
  const caja=$('#recuadro'), led1=$('#recLed'); led1.innerHTML='';
  const uno=(S.rk.noche||[])[0];
  caja.classList.toggle('vacio',!uno);
  caja.style.cssText='';
  $('#recEt').textContent='#1 DE LA NOCHE';
  const nom=$('#recNom'), pie=$('#recPie');
  if(!uno){
    nom.textContent='TU NOMBRE';
    pie.textContent='PEGÁ Y EL #1 ES TUYO';
  }else{
    led1.appendChild(led(uno.score,7.6,'#FF3B1F'));
    nom.textContent=uno.nombre||'ANÓNIMO';
    pie.textContent='¿LE GANÁS?';
  }
  /* Los dos renglones en UNA linea y ADENTRO del recuadro: se achican hasta
     entrar (scrollWidth: la tele va girada). Antes el de abajo no se media y
     con un texto largo se salia por el costado. */
  nom.style.fontSize=''; pie.style.fontSize='';
  for(let f=uno?3.6:5;f>2.2&&nom.scrollWidth>nom.clientWidth+1;f-=.1)nom.style.fontSize='calc('+f.toFixed(1)+' * var(--u))';
  for(let f=2.2;f>1.5&&pie.scrollWidth>pie.clientWidth+1;f-=.1)pie.style.fontSize='calc('+f.toFixed(1)+' * var(--u))';
  const casa=$('#recCasa');
  casa.innerHTML=S.record.score
    ?('RÉCORD DE LA CASA <b>'+(S.record.score|0)+'</b> · '+esc(S.record.nombre||'ANÓNIMO'))
    :'';
  casa.style.display=S.record.score?'':'none';
}

/* ────────── ranking ────────── */
const TABS=[
  {id:'noche',   label:'NOCHE',    premio:'GANADOR DE LA NOCHE: 1 BIRRITA'},
  {id:'mujeres', label:'Mujeres',  fem:true, premio:'EL MEJOR PUNTAJE DE LA NOCHE SE LLEVA LA BIRRITA'},
  {id:'historico',label:'HISTÓRICO',premio:CFG.PREMIO_RECORD_ACTIVO
      ?'ROMPÉ EL RÉCORD DE LA CASA: 10 PINTAS'
      :'EL MEJOR GOLPE DE LA HISTORIA DEL BEERLIN'}
];
/* UNA PESTAÑA VACÍA NO SE MUESTRA.
   El HISTÓRICO sin un solo golpe guardado no es una tabla: es un renglón
   suelto que dice "SÉ EL PRIMERO" con medio panel en negro abajo, y encima
   la rotación se queda ahí un tercio del tiempo. En la pared del bar eso se
   lee como que el tótem está roto. Mientras el histórico no tenga nada, el
   tótem gira entre NOCHE y MUJERES, y la pestaña vuelve sola el día que
   tenga algo que mostrar -sin tocar una línea-. */
function tabViva(t){
  if(!t) return false;
  if(t.id==='historico') return (S.rk.historico||[]).length>0;
  return true;
}
function pintarTabs(){
  const c=$('#tabs'); c.innerHTML='';
  TABS.forEach((t,i)=>{
    if(!tabViva(t))return;
    c.appendChild(cre('button',(i===S.tab?'on ':'')+(t.fem?'fem':''),t.label));
  });
}

/* Los lugares se abren de a dos: arrancás viendo 5, y a medida que se
   llenan aparecen los siguientes hasta 10. Los renglones se achican solos.
   Cuando quedan pocos libres, se ponen en alerta: "quedan 2 lugares".

   Con la tabla VACÍA, cinco renglones grises dicen justo lo contrario de lo
   que queremos: se leen como "acá no viene nadie". Con nadie anotado se
   muestran tres puestos -el podio- con la letra mucho más grande, y un
   cuarto asomándose abajo que avisa que la tabla sigue. Cada persona que se
   anota abre un lugar más: el ranking crece a la vista. */
function cupos(n){
  if(n<=2) return 3;                          // el podio, siempre de a tres
  return Math.min(CFG.TOP, n+1);              // y de ahi en mas, de a uno
}
/* Mientras haya menos renglones que los cinco de siempre, sobra alto: se
   reparte en letra. Tres puestos ocupando el mismo panel se leen desde el
   fondo del bar. */
function agrande(vis){ return vis<=3?1.34:(vis===4?1.15:1); }

/* Escalera de jerarquia: el primero es el mas grande y cada puesto baja un
   poquito. No es capricho -es lo que hace que la tabla se lea como un podio
   y no como una lista-: el ojo agarra primero al puntero, que es el que hay
   que pasar. La baja es leve (5,5% por escalon) y se planta en 0,78, porque
   mas abajo el quinto ya no se leeria desde el fondo del bar. */
function escalaFila(i){ return Math.max(0.78, 1 - 0.055 * i); }

/* El premio de la noche necesita un mínimo de gente anotada. El ranking ya
   viene con una fila por persona, pero se cuenta igual: si alguna vez
   cambia, el cartel no miente. */
const MIN_PERSONAS=3;
function personasAnotadas(){
  const vistos={}; let n=0;
  (S.rk.noche||[]).forEach(function(p){
    const k=String(p&&p.nombre||'').trim().toLowerCase();
    if(k&&!vistos[k]){vistos[k]=1;n++;}
  });
  return n;
}

/* Cuantos renglones se ven A LA VEZ. Antes se metian los 10 en el mismo alto
   y cada nombre terminaba midiendo 1,6% de la pantalla: a cuatro metros, con
   el bar a media luz, eso no se lee. Cinco renglones ocupan el mismo espacio
   con la letra al doble. Los puestos 6 al 10 no desaparecen: la tabla pasa de
   pagina sola, igual que cambian las pestanas. */
const FILAS_VISIBLES=5;
/* LAS PAGINAS LAS MANDA LA GENTE ANOTADA, NO LOS LUGARES LIBRES.
   Con 5 anotados el cupo abre el 6to lugar, y contando cupos daba DOS
   paginas: la segunda era un unico renglon "LUGAR LIBRE" solo en medio del
   panel. Exactamente el mismo papelon que el historico vacio. Las paginas se
   cuentan por nombres reales; el lugar libre se suma al final de la ultima
   pagina si entra, y si no entra espera a que alguien mas se anote -que es
   cuando esa pagina existe de verdad-. */
/* EL HISTORICO NO PASA DE PAGINA.
   "El mejor golpe de la historia del Beerlin" son los primeros. El sexto de
   todos los tiempos no le interesa a nadie y encima obligaba a una segunda
   pagina que quedaba con dos o tres renglones sueltos en medio del panel.
   Se corta en cinco y se muestra de una. */
const HISTORICO_TOPE=5;
function paginasDe(idTab){
  if(idTab==='historico')return 1;
  const n=(S.rk[idTab]||[]).length;
  return Math.max(1,Math.ceil(n/FILAS_VISIBLES));
}
/* La rotacion recorre pestana+pagina: si el ranking de la noche tiene 8
   personas, la pestana NOCHE se queda el doble de tiempo (una vuelta para
   cada pagina) y las otras no pierden su turno. */
function vistaSiguiente(){
  const v=[];
  TABS.forEach(function(t,i){
    if(!tabViva(t))return;
    const p=paginasDe(t.id);
    for(let k=0;k<p;k++) v.push({tab:i,pag:k});
  });
  if(!v.length)v.push({tab:0,pag:0});
  /* Mientras no haya nadie anotado, las tablas de la noche son renglones
     libres. Para que la tele no pase la mitad del tiempo mostrando lugares
     vacios, el HISTORICO -que tiene nombres y puntajes de verdad- se
     intercala entre cada una: historico, noche, historico, mujeres. Apenas
     se anota el primero, la rotacion vuelve a ser la de siempre. */
  if(!(S.rk.noche||[]).length){
    const hist=v.filter(function(x){return TABS[x.tab].id==='historico';})[0];
    if(hist){
      const otros=v.filter(function(x){return x!==hist;});
      v.length=0;
      otros.forEach(function(o){v.push(hist);v.push(o);});
    }
  }
  S.vista=(S.vista+1)%v.length;
  const a=v[S.vista]||v[0];
  S.tab=a.tab; S.pag=a.pag;
}

/* El que acaba de pegar late en la tabla durante una vuelta. */
function esYo(e){
  const r=S.resaltar;
  if(!r||Date.now()>r.hasta||!e)return false;
  return String(e.nombre||'').trim().toLowerCase()===String(r.nombre||'').trim().toLowerCase();
}
function pintarRanking(){
  /* Si el histórico se vació mientras estaba en pantalla (se ocultó la
     última piña real), no nos quedamos parados en una tabla sin filas. */
  if(!tabViva(TABS[S.tab])){S.tab=0;S.pag=0;}
  const t=TABS[S.tab], fem=!!t.fem;
  $('#panel').className=fem?'fem':'';
  $('#premioEt').textContent=t.premio;
  const c=$('#cuenta'), f=$('#filas'); f.innerHTML='';

  if(t.id==='noche'||t.id==='mujeres'){
    const e=entrega(); c.style.display='block'; c.className=e.urge?'urge':'';
    /* Cuando pasó la hora ya sabemos quién ganó: decirlo vale más que el
       genérico de antes, y le recuerda al ganador que lo tiene que ir a
       buscar. En la pestaña de mujeres se nombra a la reina. */
    const gana=fem?S.reina:S.rey;
    /* En la última hora, si todavía no hay tres personas anotadas, el reloj
       no es la noticia: la noticia es que así no se entrega nada. Decirlo
       convierte -el que está mirando se anota- y además evita el papelón de
       prometer una birrita que el sistema no va a dar. */
    const gente=personasAnotadas(), faltan=MIN_PERSONAS-gente;
    const reloj=`${e.h}H ${String(e.m).padStart(2,'0')}M`;
    c.innerHTML=e.pasado
      ?(gana?`GANÓ <b>${esc(gana.nombre)}</b> — ${gana.entregado?'PREMIO ENTREGADO':'RETIRALO EN LA CAJA'}`
            :'PREMIO ENTREGADO — ARRANCA UNA NOCHE NUEVA')
      /* Los dos mensajes no entran juntos en el renglón: partido en dos
         líneas le roba alto a la tabla. Se alternan con el giro de pestañas,
         que además los hace notar más que un cartel quieto. */
      :(e.urge&&faltan>0&&S.vista%2===0
        ?`${faltan===1?'FALTA <b>1 PERSONA</b>':'FALTAN <b>'+faltan+' PERSONAS</b>'} PARA LA BIRRITA`
        /* "Faltan 8 horas" a las 7 de la tarde no apura a nadie: es ruido.
           Con mas de dos horas se dice la hora y listo; el reloj aparece
           cuando ya corre. */
        :(e.h>=2?`LA BIRRITA SE ENTREGA A LAS <b>${e.label}</b>`
                :`PREMIO A LAS ${e.label} — FALTAN <b>${reloj}</b>`));
    if(e.urge&&faltan>0)c.className='urge';
    /* Se achica hasta entrar en un renglon. Se mide con scrollWidth y no con
       getBoundingClientRect: el totem esta girado 90 grados y el rectangulo
       girado da el alto donde uno espera el ancho. */
    c.style.fontSize='';
    for(let t=1.95;t>1.2&&c.scrollWidth>c.clientWidth+1;t-=0.05)
      c.style.fontSize='calc('+t.toFixed(2)+' * var(--u))';
  }else c.style.display='none';

  /* ─── NOCHE / HISTÓRICO ─── */
  const lista=S.rk[t.id]||[];
  /* El puntaje de los puestos 2 en adelante era ROJO PURO. En una tele a
     cuatro metros, en un bar a media luz, el rojo saturado es el peor color
     que existe: el ojo tiene menos agudeza en esa longitud de onda y los
     bordes se desarman. El ámbar tiene la misma temperatura de arcade y se
     lee muchísimo mejor. El rojo se queda donde sí funciona: en el récord
     gigante de arriba, que mide ocho veces esto. */
  const oro=fem?'#F1437B':'#FFD518', led2=fem?'#ff7aa8':'#FFA91E';
  /* EL HISTÓRICO NO TIENE LUGARES LIBRES.
     La tabla de la noche es una invitación: los renglones vacíos dicen
     "metete, hay lugar". El histórico es lo contrario, es el registro de lo
     que ya pasó en el bar. Mostrarle a alguien "LUGAR LIBRE" en la lista de
     los mejores golpes de la historia no lo invita a nada: le dice que acá
     no vino nadie nunca, que es justo lo contrario de lo que esa tabla
     tiene que transmitir. Así que el histórico muestra sólo lo que existe. */
  const esHistorico=t.id==='historico';
  const vis=esHistorico?Math.max(1,Math.min(HISTORICO_TOPE,lista.length)):cupos(lista.length);
  const libres=vis-lista.length;
  const alerta=!esHistorico&&vis>=8&&libres>0;
  const totalPag=paginasDe(t.id);
  if(S.pag>=totalPag)S.pag=0;
  const hasta=Math.min(vis,S.pag*FILAS_VISIBLES+FILAS_VISIBLES);
  /* La ultima pagina no puede quedar con uno o dos renglones flotando en
     medio del panel: se mira de lejos y parece una pantalla a medio cargar.
     Si sobran menos de tres, la ventana se corre para atras y muestra los
     cinco ultimos puestos. Se superpone un poco con la pagina anterior, y
     esta bien: el numero de puesto va al lado de cada nombre, asi que nadie
     se pierde -y el que llego tarde ve al que tiene que pasar-. */
  const MIN_EN_PAGINA=3;
  let desde=S.pag*FILAS_VISIBLES;
  if(hasta-desde<MIN_EN_PAGINA)desde=Math.max(0,hasta-Math.min(FILAS_VISIBLES,vis));
  const ultimaPag=S.pag===totalPag-1;

  /* Se dibuja con un factor de escala. Si el conjunto (filas + los dos avisos
     de abajo) no entra en el alto del panel, se vuelve a dibujar mas chico.
     Antes no se medía: los avisos se salían del panel y quedaban pintados
     encima de las cards de la zona baja. */
  let gr=agrande(vis);
  const dibujar=(k,ap)=>{
    f.innerHTML='';
    f.style.setProperty('--apr',(ap==null?k:ap).toFixed(3));
    /* Ya no hace falta achicar segun cuanta gente hay: en pantalla siempre
       hay cinco renglones, midan lo que midan. El factor k solo entra si un
       nombre larguisimo no entra, y baja muy poco. El factor gr sube la
       letra cuando hay menos de cinco renglones y sobra alto. */
    const fs=(Math.max(2.4,3.6*k)*gr).toFixed(2);
    const fled=Math.max(2.4,3.5*k)*gr;
    for(let i=desde;i<hasta;i++){
      const e=lista[i];
      const esc2=escalaFila(i);
      const row=cre('div','fil'+(i===0&&e?' uno':'')+(e?'':' vacio')+
        (!e&&i===0?' primero':'')+(!e&&alerta?' alerta':'')+(e&&esYo(e)?' yo':''));
      const pos=cre('span','pos',String(i+1));
      pos.style.fontSize='calc('+Math.max(2.3,3.1*k)*gr*(0.55+0.45*esc2)+' * var(--u))';
      /* Los colores del podio llevan información -oro, plata, bronce- y por
         eso se quedan. Lo que estaba mal era el brillo: el bronce #b45309 es
         marrón oscuro y sobre negro casi no existe, y del cuarto para abajo
         el gris #4b5563 directamente desaparecía. Mismos colores, subidos a
         un brillo que se lee desde el fondo del bar. */
      pos.style.color=e?(i===0?oro:i===1?'#E8EDF5':i===2?'#E08A2B':'#93A0B4'):(alerta?'#FF2A2A':'#4b5563');
      row.appendChild(pos);
      const dat=cre('div','dat');
      /* Un renglón vacío tiene que leerse como UN LUGAR QUE ESTÁ LIBRE, no
         como un hueco. La diferencia la hacen tres cosas juntas: el borde
         punteado (que en cualquier lado del mundo significa "acá va algo"),
         la palabra LIBRE donde iría el puntaje, y que el primero diga "sé
         el primero" en vez del genérico. Antes era un renglón gris al 42%
         que se leía como tabla apagada. */
      const n=cre('span','n',e?e.nombre
        :(i===0?(fem?'SÉ LA PRIMERA':'SÉ EL PRIMERO'):'LUGAR LIBRE'));
      n.style.fontSize='calc('+(fs*esc2).toFixed(2)+' * var(--u))';
      dat.appendChild(n);
      /* Antes salia el usuario pelado ("Faustocargnelutti") y parecia un
         apellido. Con el logo y el arroba se lee como lo que es: un Instagram
         al que se puede entrar. */
      if(e&&e.ig){
        const a=cre('span','a');
        a.style.fontSize='calc('+Math.max(1.35,1.5*k)+' * var(--u))';
        const ar=String(e.ig).trim().replace(/^@+/,'');
        a.innerHTML='<span style="display:inline-block;width:calc('+Math.max(1.35,1.5*k)+' * var(--u));height:calc('+Math.max(1.35,1.5*k)+
          ' * var(--u));vertical-align:calc(-0.18 * var(--u));margin-right:calc(.35 * var(--u))">'+igSVG()+'</span>@'+
          esc(ar);
        dat.appendChild(a);
      }
      row.appendChild(dat);
      if(e)row.appendChild(led(e.score,fled*esc2,i===0?oro:led2));
      else if(i>0){
        /* Donde va el puntaje va la palabra LIBRE. Sin esto el renglón queda
           rengo -texto a la izquierda y nada a la derecha- y parece roto en
           vez de disponible.
           En el PRIMER puesto no va: "SÉ EL PRIMERO" es más largo que
           "LUGAR LIBRE" y con la chapita al lado no entraba -salía cortado
           con puntos suspensivos-. Ese renglón ya se distingue solo, con el
           borde y la letra en oro. */
        const lb=cre('span','libre','LIBRE');
        lb.style.fontSize='calc('+Math.max(1.6,1.9*k*esc2)+' * var(--u))';
        row.appendChild(lb);
      }
      f.appendChild(row);
    }
    /* El puesto siguiente, asomándose: se le ve la mitad de arriba y se
       desvanece. Sin él, tres renglones parecen toda la tabla; con él se
       entiende que hay más lugares y que estos tres son sólo el podio. */
    /* El puesto siguiente, asomándose. Antes era un renglón recortado con un
       degradado encima: en la pantalla real no se apreciaba, se leía como un
       renglón cortado por un error. Ahora es un renglón de verdad, más bajo
       y más tenue, con el mismo borde punteado que los libres. Dice lo mismo
       -la tabla sigue, hay lugar- sin depender de un efecto que puede no
       renderizar en el navegador del TV Box. */
    if(!esHistorico&&vis<FILAS_VISIBLES&&ultimaPag){
      const as=cre('div','fil vacio asoma');
      const ps=cre('span','pos',String(vis+1));
      ps.style.fontSize='calc('+Math.max(1.6,2.4*k)*gr+' * var(--u))';
      as.appendChild(ps);
      const dt=cre('div','dat');
      const nn=cre('span','n','LUGAR LIBRE');
      nn.style.fontSize='calc('+(fs*0.72).toFixed(2)+' * var(--u))';
      dt.appendChild(nn);
      as.appendChild(dt);
      const lb=cre('span','libre','LIBRE');
      lb.style.fontSize='calc('+Math.max(1.6,1.6*k)+' * var(--u))';
      as.appendChild(lb);
      f.appendChild(as);
    }
    /* El que quedó justo afuera del top 5 es el que más cerca está de comprar
       otro tiro. Se le dice el número exacto que le falta. */
    const avisosCaben = k>=0.92 && (ap==null?k:ap)>=0.55;
    if(avisosCaben && t.id!=='historico' && S.pag===0 && lista.length>=5 && lista[4]){
      const corte=lista[4].score;
      const af=cre('div','avisoCupo','CON '+(corte+1)+' PUNTOS ENTRÁS AL TOP 5');
      af.style.color='var(--oro)';
      f.appendChild(af);
    }
    if(avisosCaben&&alerta&&ultimaPag){
      const av=cre('div','avisoCupo',
        libres===1?'QUEDA 1 LUGAR EN EL TOP 10':`QUEDAN ${libres} LUGARES EN EL TOP 10`);
      f.appendChild(av);
    }
  };
  /* Cuando no entra, primero se saca AIRE (el relleno de cada renglon) y
     recien despues se achica la LETRA. Antes achicaba las dos cosas a la vez:
     con el ranking lleno los nombres quedaban de la mitad del tamano por un
     problema de espacio que se resolvia sacando margenes, que nadie lee. */
  const noEntra=()=>f.scrollHeight>f.clientHeight+1;
  /* Un nombre con puntos suspensivos es peor que un nombre un poco mas
     chico: el tipo vino a ver SU nombre en la tele. El agrande de la tabla
     vacia se baja hasta que entren todos, pero nunca por debajo de 1, que
     es el tamano de siempre; ahi ya manda el ellipsis, como antes. */
  const cortado=()=>Array.prototype.some.call(f.querySelectorAll('.n'),
    function(x){ return x.scrollWidth>x.clientWidth+1; });
  dibujar(1,1);
  for(let i=1;i<=10 && gr>1 && cortado();i++){ gr=Math.max(1,gr-0.05); dibujar(1,1); }
  /* EL AGRANDADO TAMBIEN SE DEVUELVE SI NO ENTRA DE ALTO.
     Con pocos renglones la letra se agranda (gr), y ese agrandado solo se
     bajaba si un nombre quedaba cortado de ANCHO. Si lo que no entraba era
     el ALTO -pantalla chica, nombres con Instagram abajo, el renglon que se
     asoma- el agrandado se quedaba, la letra ya estaba en su minimo, y la
     ultima fila se salia del panel y quedaba encima del cartel de abajo
     ("FALTAN 3 PERSONAS"). Es un regalo para cuando sobra lugar: si no
     sobra, se devuelve antes de achicar nada mas. */
  for(let i=1;i<=10 && gr>1 && noEntra();i++){ gr=Math.max(1,gr-0.05); dibujar(1,1); }
  for(let i=1;i<=8 && noEntra();i++) dibujar(1,Math.max(0.2,1-0.1*i));
  for(let i=1;i<=14 && noEntra();i++) dibujar(Math.max(0.42,1-0.05*i),0.2);
  /* Ultimo recurso: si con todo al minimo sigue sin entrar, se sacan del
     final lo que es adorno -los avisos y el renglon que se asoma- hasta que
     entre. Un nombre real nunca se saca: lo que se va es lo que no es de
     nadie. Nada puede quedar pisando la zona de abajo. */
  while(noEntra()&&f.lastElementChild&&
        (!f.lastElementChild.classList.contains('fil')||f.lastElementChild.classList.contains('asoma')))
    f.removeChild(f.lastElementChild);
}

/* Un "hasta las 21" no apura a nadie; un "termina en 47 min" sí.
   El AHORA amarillo salió de la cejilla: ya está la pastilla roja abajo. */
function faltaHappy(){
  const d=new Date();
  const min=(CFG.HAPPY.hasta*60)-(d.getHours()*60+d.getMinutes());
  if(min<=0)return 'ÚLTIMOS MINUTOS';
  if(min<=30)return 'ÚLTIMOS '+min+' MINUTOS';
  const h=Math.floor(min/60), m=min%60;
  return h?('TERMINA EN '+h+' H '+String(m).padStart(2,'0')+' MIN'):('TERMINA EN '+m+' MIN');
}
function cardHappy(){return{
  ceja:faltaHappy(), vivo:true, urgente:true, color:'#FFD518',
  tituloHTML:'HAPPY <span style="color:#fff">BEER</span><span style="color:var(--rojo)">PUNCH</span>',
  destacado:'2 PIÑAS', precio:'$2.000', antes:'$4.000'};}

/* La última hora del happy es la hora más barata de la noche y nadie se
   entera: a las 21:01 el mismo billete compra la mitad. Se le pone reloj,
   se dice lo que se pierde y se dice en cuánto tiempo. */
const CIERRE_HAPPY_MIN = 60;
function minutosDeHappy(){
  const d=new Date();
  return (CFG.HAPPY.hasta*60)-(d.getHours()*60+d.getMinutes());
}
const cierraHappy=()=>esHappy()&&minutosDeHappy()<=CIERRE_HAPPY_MIN;
function cardCierreHappy(){
  const m=Math.max(0,minutosDeHappy());
  return {
    ceja:'Happy hour · termina en', vivo:true, urgente:true, color:'#FF2A2A',
    mega:(m<=1?'1 MIN':m+' MIN'),
    destacado:'2 PIÑAS', precio:'$2.000', antes:'$4.000',
    txt:`después de las ${CFG.HAPPY.hasta} con esa plata tirás una sola`
  };
}
/* Los últimos 45 minutos antes de entregar la birra son el momento de más
   conversión de la noche: el que está #6 sabe que se le escapa y todavía
   puede comprar tiros. Antes ahí no pasaba nada especial. */
const ULTIMA_HORA_MIN = 60;
function esUltimaHora(){ const e=entrega(); return !e.pasado && (e.h*60+e.m)<=ULTIMA_HORA_MIN; }

function cardUltimaHora(){
  const e=entrega(), l=S.rk.noche[0], sexto=S.rk.noche[4];
  const reloj=`${e.h?e.h+'H ':''}${String(e.m).padStart(2,'0')}M`;
  const gente=personasAnotadas(), faltan=MIN_PERSONAS-gente;
  /* Si no se llega al mínimo, esto no es una carrera: es un pedido. El que
     mira la pantalla es exactamente el que falta, y hay que decírselo con
     esas palabras. */
  if(faltan>0) return {
    ceja:'Para que salga la birrita', vivo:true, urgente:true, color:'#FF2A2A', vaso:gente/MIN_PERSONAS,
    mega: faltan===1?'FALTA 1':'FALTAN '+faltan,
    destacado: faltan===1?'PERSONA':'PERSONAS',
    txt:`tienen que anotarse ${MIN_PERSONAS} distintas · quedan ${reloj}`
  };
  /* Cinco bloques no entran en la card. El reloj es el mensaje; el resto
     va en una sola línea de apoyo. */
  return {
    ceja:'Última hora · se entrega en', vivo:true, urgente:true, color:'#FF2A2A',
    mega:reloj,
    txt: l ? (sexto ? `${l.nombre} va ganando con ${l.score} · el top 5 cierra en ${sexto.score}`
                    : `${l.nombre} va ganando con ${l.score} puntos · el que pega más fuerte se la lleva`)
           : 'la birra sigue sin dueño'
  };
}
/* Loss aversion: al que va ganando se le avisa que se la están por sacar.
   Defender algo motiva más que ganarlo, y el que defiende también compra. */
function cardEnRiesgo(){
  const a=S.rk.noche[0], b=S.rk.noche[1];
  if(!a||!b) return null;
  const dif=a.score-b.score;
  if(dif>25) return null;
  return { ceja:'La birra está en juego', color:'#FF2A2A',
    titulo:`${a.nombre} LA GANA`, mega:`POR ${dif}`,
    destacado:'PUNTOS', txt:`${b.nombre} está a un golpe de sacársela` };
}

    if(d.mega.length>8)m.style.fontSize='calc(3.4 * var(--u))';       // frases: más chico que un precio
    c.appendChild(m);
  }
  if(d.destacado||d.precio){
    const r=cre('div','fila2');
    if(d.destacado){const b=cre('span','big',d.destacado);b.style.color=d.color;r.appendChild(b);}
    /* El precio tachado al lado del precio es lo que convierte un número en
       una oferta: sin el de antes, "$2.000" no dice si es caro o barato. */
    if(d.antes){const t=cre('span','antes',d.antes);r.appendChild(t);}
    if(d.precio){const p=cre('span','big',d.precio);p.style.color='#fff';r.appendChild(p);}
    c.appendChild(r);
  }
  if(d.txt)c.appendChild(cre('div','txt',d.txt));
  acomodarCard(c);
}

/* Mide la card ya dibujada. Si el contenido es mas alto que la caja, aprieta
   un escalon; si todavia desborda, dos. La card de "TE DEVOLVEMOS $2.000" se
   pasaba por unos pocos pixeles y el "Etiquetanos @beerpunch.mdz" quedaba
   cortado contra el borde de abajo. */
function acomodarCard(c){
  c.classList.remove('ap1','ap2','ap3');
  const pasos=['ap1','ap2','ap3'];
  for(let i=0;i<pasos.length;i++){
    if(c.scrollHeight<=c.clientHeight+1)return;
    c.classList.remove('ap1','ap2','ap3');
    c.classList.add(pasos[i]);
  }
}
setInterval(()=>{if(S.ocupado||S.packsAbierto)return;S.card++;pintarCard();},T.card);
/* El recuadro del QR tiene que cambiar solo al coronar y volver solo cuando
   se cumple la hora, sin que nadie toque nada. */
let qrEnModoPremio=false;
setInterval(()=>{
  const ahora=!!reyVigente();
  if(ahora!==qrEnModoPremio){ qrEnModoPremio=ahora; pintarQR(); }
},20000);

/* ────────── QR de carga ────────── */
/* Durante la hora siguiente a la entrega del premio, este recuadro cambia de
   cartel: deja de invitar a cargar una pina y pasa a ser la unica forma de
   retirar el premio. Es el lugar mas grande y mas fijo que tiene el totem, y
   a esa hora ya no hay ranking que ganar: lo unico que falta es que el que
   gano vaya a buscar su birrita. */
const REY_VENTANA_MS=60*60*1000;
function reyVigente(){
  const r=S.rey;
  if(!r||!r.ts)return null;
  if(r.entregado&&(!S.reina||S.reina.entregado))return null;   // ya lo retiraron
  if(Date.now()-r.ts>REY_VENTANA_MS)return null;
  return r;
}
function pintarQR(){
  const rey=reyVigente();
  const url=rey
    ? (CFG.URL_PREMIO||(location.origin+'/premio'))
    : (CFG.URL_CARGA||(location.origin+'/m'));
  const q=$('#qr'); q.innerHTML='';
  q.classList.toggle('premio',!!rey);
  /* Primero el texto, despues se mide lo que sobra y el QR se dibuja de ese
     tamano. Antes era una medida fija que dejaba la mitad del recuadro vacio:
     este es el QR con el que la gente carga su pina, tiene que leerse parado
     al lado de la maquina, no pegado a la pantalla. */
  const hueco=cre('div','hueco'); q.appendChild(hueco);
  const t=cre('div'); t.style.cssText='text-align:center;flex:none';
  if(rey){
    t.appendChild(cre('div','t1','¿GANASTE?\nESCANEÁ')).style.whiteSpace='pre-line';
    t.appendChild(cre('div','t2','TU CÓDIGO PARA LA CAJA')).style.whiteSpace='pre-line';
  }else{
    t.appendChild(cre('div','t1','TU NOMBRE\nEN PANTALLA')).style.whiteSpace='pre-line';
    t.appendChild(cre('div','t2','ESCANEÁ Y CARGÁ')).style.whiteSpace='pre-line';
  }
  q.appendChild(t);
  /* Misma red que en la pantalla de precios: si la medida no sirve todavía,
     se reintenta y después se estima. Este QR es el que carga las fichas:
     que no aparezca es perder la venta. */
  const poner=function(intento){
    const r=hueco.getBoundingClientRect();
    let lado=Math.floor(Math.min(r.width,r.height));
    if(lado<40){
      if(intento<2){requestAnimationFrame(function(){poner(intento+1);});return;}
      lado=Math.round(UPX*15);
    }
    if(lado<40)return;
    /* Zona muda de 2 modulos en vez de 3. La norma pide 4 y todos los
       lectores de telefono leen con 2 cuando el QR esta sobre blanco puro,
       que es el caso: el fondo del svg es blanco. Esos dos modulos que se
       ahorran de cada lado se los queda el dibujo, o sea el QR negro crece
       casi un 12% sin ocupar un pixel mas de pantalla. */
    const sv=qrSVG(url,lado,2);
    if(sv&&!hueco.querySelector('svg'))hueco.appendChild(sv);
  };
  poner(0);
}

/* ────────── takeover de precios ────────── */
/* Fuera del happy, el pack de 1 NO puede seguir diciendo "pagás 1, tirás 2":
   a esa hora el servidor entrega una sola ficha (fichasPorMonto), así que el
   cartel estaría prometiendo algo que la máquina no da. */
function preciosAhora(){
  const lista=PRECIOS.map(x=>Object.assign({},x));
  if(esHappy()){
    /* Hasta las 21, $2.000 son DOS tiros. Antes el cartel decia "1 TIRO" y
       abajo aclaraba "pagas 1, tiras 2": a cuatro metros nadie lee la
       aclaracion, y el que la lee tiene que hacer la cuenta. Ahora el cartel
       dice directamente lo que te llevas. */
    lista[0].muestra=2;
    lista[0].nota='$1.000 cada tiro';
    lista[0].antes='$4.000';      // lo que salen esos dos tiros despues de las 21
    /* En la ultima hora la pastilla deja de decir "HAPPY HOUR" -que no apura
       a nadie- y pasa a decir cuanto falta. */
    const q=minutosDeHappy();
    if(q<=CIERRE_HAPPY_MIN){
      lista[0].tag=(q<=1?'ÚLTIMO MINUTO':'ÚLTIMOS '+q+' MIN');
      lista[0].color='#FF2A2A';
    }
    lista[0].extra='';
    /* Y es EL cartel destacado mientras dura: es la unica oferta que se vence.
       El de 8 tiros suelta el destaque hasta las 21, porque dos carteles
       gritando al mismo tiempo es lo mismo que ninguno. */
    lista[0].hero=true; lista[0].urge=true;
    lista[2].hero=false;
  }else{
    lista[0].tag='PARA PROBAR';   // decia "1 TIRO", igual que el titulo de abajo: repetir no suma
    lista[0].color='#9CA3AF';
    lista[0].nota='$2.000 el tiro';
    lista[0].extra='';
  }
  return lista;
}

/* Blanco sobre amarillo no se lee. El color del texto de cada pastilla sale
   del brillo real del fondo, no de una excepcion escrita a mano. */
function textoSobre(hex){
  const h=String(hex).replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>150?'#111':'#fff';
}

let focoReloj=null;
function pintarPacks(otra){
  const PRECIOS_HOY=preciosAhora();
  const p=$('#packs'); p.innerHTML='';
  /* Hay que mostrarlo antes de armarlo: mas abajo se mide cuanto espacio
     sobra en cada tarjeta para dibujar el QR mas grande que entre, y algo
     oculto mide cero. */
  p.style.display='flex';
  /* El logo y el titulo van en una sola linea. Apilados se llevaban un tercio
     de la pantalla para decir algo que la gente ya sabe, y ese espacio le
     hace mucha mas falta al QR. */
  const cab=cre('div'); cab.style.cssText='text-align:center;flex:none';
  const f=cre('div',''); f.style.cssText='display:flex;align-items:center;justify-content:center;gap:calc(1.6 * var(--u))';
  const im=cre('img'); im.src=$('#logo').src;
  im.style.cssText='width:calc(6.6 * var(--u));height:calc(6.6 * var(--u));object-fit:contain;animation:respira 3.4s ease-in-out infinite';
  f.appendChild(im);
  const ti=cre('div',''); ti.innerHTML=otra?'VAMOS POR <span style="color:var(--rojo)">OTRA</span>'
                                          :'ELEGÍ TUS <span style="color:var(--rojo)">TIROS</span>';
  ti.style.cssText='font-family:var(--poster);font-size:calc(5.6 * var(--u));letter-spacing:1.5px;line-height:1;white-space:nowrap';
  f.appendChild(ti); cab.appendChild(f);
  const sub=cre('div','','¿CUÁNTO PEGÁS?');
  sub.style.cssText='color:var(--suave);font-weight:600;letter-spacing:7px;font-size:calc(1.5 * var(--u));margin-top:calc(.4 * var(--u))';
  cab.appendChild(sub); p.appendChild(cab);
  /* El titulo va en una sola linea, pero "ELEGI TUS TIROS" al lado del logo no
     entra en cualquier pantalla. En vez de elegir un tamano fijo y rezar, se
     mide y se achica hasta que entra. */
  const est=getComputedStyle(p);
  const anchoUtil=p.clientWidth-parseFloat(est.paddingLeft)-parseFloat(est.paddingRight);
  for(let t=5.6;t>3.2 && f.scrollWidth>anchoUtil;t-=0.2){
    ti.style.fontSize='calc('+t.toFixed(1)+' * var(--u))';
  }
  const porMedir=[];

  const grid=cre('div'); grid.style.cssText='flex:1;display:flex;flex-direction:column;gap:4.4%;min-height:0';
  for(let r=0;r<2;r++){
    const fila=cre('div'); fila.style.cssText='flex:1;display:flex;gap:4%;min-height:0';
    for(let k=0;k<2;k++){
      const d=PRECIOS_HOY[r*2+k];
      const card=cre('div','pk');
      card.style.borderColor=d.color;
      card.style.background=`radial-gradient(120% 90% at 50% -10%,${d.color}${d.hero?'33':'1f'},rgba(7,9,16,.9) 62%),#07090f`;
      card.style.boxShadow=`0 0 ${d.hero?46:30}px ${d.hero?'-12':'-22'}px ${d.color}`;
      if(d.hero){
        /* Antes el destacado latia agrandandose, y eso chocaba con el foco que
           recorre las tarjetas (los dos mueven lo mismo). Ahora respira un
           resplandor aparte: no se pisan y ademas es mas liviano. */
        const aura=cre('span','aura');
        aura.style.boxShadow='0 0 calc(5 * var(--u)) calc(.6 * var(--u)) '+d.color;
        card.appendChild(aura);
      }
      const tag=cre('span','tag',d.tag);
      if(d.urge)tag.classList.add('urge');   // en happy, la pastilla titila
      tag.style.cssText+=`background:${d.color};color:${textoSobre(d.color)}`;
      card.appendChild(tag);
      const cuantos=d.muestra||d.n;
      card.appendChild(cre('div','cant',`${cuantos} ${cuantos===1?'TIRO':'TIROS'}`));
      const pr=cre('div','prec',d.precio);
      /* En happy, al lado del precio va tachado lo que costarían esos mismos
         tiros a las 21:05. Un precio solo es un precio; dos son una oferta. */
      if(d.antes){
        const t=cre('span','antesPk',d.antes);
        pr.appendChild(document.createTextNode(' '));
        pr.appendChild(t);
      }
      card.appendChild(pr);
      const nota=cre('div','cu',d.nota); if(d.extra){nota.textContent=d.nota+' · '+d.extra;} card.appendChild(nota);
      const link=CFG.PAGO[d.n];
      if(link){
        const hueco=cre('div','hueco'); card.appendChild(hueco);
        card.appendChild(cre('div','esc','ESCANEÁ Y PAGÁ'));
        porMedir.push({hueco:hueco,link:link,orden:r*2+k});
      }
      else{const ef=cre('div','esc','EFECTIVO EN LA CAJA');ef.style.padding='calc(2.4 * var(--u)) 0';card.appendChild(ef);}
      fila.appendChild(card);
    }
    grid.appendChild(fila);
  }
  p.appendChild(grid);
  const pie=cre('div',''); pie.style.cssText='text-align:center;border-radius:12px;padding:2% 4%;border:1px solid rgba(255,213,24,.55);background:rgba(255,213,24,.07)';
  pie.innerHTML='<div style="font-family:var(--poster);font-size:calc(2.7 * var(--u));line-height:1;white-space:nowrap">'+
    'EFECTIVO O <span style="color:var(--oro)">QR</span> · MISMO PRECIO</div>'+
    '<div style="font-family:var(--cuerpo);font-weight:600;font-size:calc(1.5 * var(--u));color:var(--suave);'+
    'letter-spacing:.5px;margin-top:calc(.6 * var(--u))">El pack de 3 tiros está disponible solo con QR</div>';
  p.appendChild(pie);

  /* Segunda pasada: ya con todo ubicado, cada QR se dibuja del tamano exacto
     del hueco que le quedo. Antes era una medida fija chica y sobraba lugar
     alrededor; de lejos, un QR chico no se escanea. */
  /* Un foco que recorre los packs de a uno: la tarjeta se agranda, le pasa
     el barrido de luz por encima y suena su nota. Antes los cuatro barridos
     corrian juntos y en el aparato eso trababa la entrada; de a uno pesa la
     cuarta parte y encima guia la mirada de una tarjeta a la otra. */
  if(focoReloj){clearInterval(focoReloj);focoReloj=null;}
  setTimeout(function(){
    const tarjetas=[].slice.call(p.querySelectorAll('.pk'));
    if(!tarjetas.length)return;
    let i=-1;
    const mover=function(){
      tarjetas.forEach(c=>c.classList.remove('foco'));
      i=(i+1)%tarjetas.length;
      const c=tarjetas[i];
      c.classList.add('foco');
      const br=c.querySelector('.barrido');
      if(br){br.style.animation='none';void br.offsetWidth;
             br.style.animation='barre 2.2s ease-in-out';}
      tacSonido(i);
    };
    mover();
    focoReloj=setInterval(mover,2400);
  },600);

  /* EL QR NO PUEDE FALTAR NUNCA.
     Acá se medía el hueco y, si la medida daba menos de 40, no se dibujaba
     nada y listo: las cuatro tarjetas quedaban con el precio y sin QR, que
     es la pantalla más cara que puede mostrar el tótem -alguien decidido a
     pagar y sin dónde escanear-. En una tele lenta, el primer paso de layout
     puede dar cero aunque el panel ya esté visible, y ahí se caían los cuatro
     QR a la vez sin que quedara rastro. Ahora: se mide, y si la medida no
     sirve se reintenta en el cuadro siguiente; si tampoco, se calcula el lado
     a partir del alto del tótem en vez de rendirse. Un QR de tamaño estimado
     se escanea; un QR que no está, no. */
  const ponerQR=function(t,intento){
    const r=t.hueco.getBoundingClientRect();
    let lado=Math.floor(Math.min(r.width,r.height));
    if(lado<40){
      if(intento<2){requestAnimationFrame(function(){ponerQR(t,intento+1);});return;}
      lado=Math.round(UPX*17);            // red de emergencia: 17% del alto
    }
    if(lado<40)return;
    const sv=qrSVG(t.link,lado);
    if(!sv)return;
    /* Un QR quieto en una pantalla es un cuadrito más. Con el barrido
       de luz encima el ojo lo lee como "esto se usa". */
    const env=cre('div','qrEnv'); env.appendChild(sv);
    const br=cre('span','barrido');
    env.appendChild(br); t.hueco.appendChild(env);
  };
  porMedir.forEach(function(t){ponerQR(t,0);});
}
/* LOS PRECIOS SALEN CUANDO HAY GANAS DE COMPRAR.

/* ────────── el golpe en vivo ──────────
   La pantalla que sale cuando alguien pega. Sale del reel de marca: la tele
   se convierte en el marcador de la maquina -rojo, siete segmentos, contando
   desde 000- con las luces de arcade de los costados prendiendose a medida
   que sube el numero. Si el golpe rompe el record, en el instante exacto en
   que el contador pasa el record viejo la pantalla hace el glitch: el que
   pego lo ve pasar, que es lo que se filma.
   Es una capa encima del totem: no toca el ranking, ni el arranque, ni nada
   de lo que ya anda. */

/* Un marcador que se arma UNA vez y despues solo cambia colores. El de antes
   se rearmaba entero en cada cuadro (cientos de elementos por segundo); en
   la Fire TV eso es la diferencia entre contar fluido o a los saltos. */
function ledVivo(digitos,alto,color){
  const ns='http://www.w3.org/2000/svg';
  const cont=cre('div','principal');
  cont.style.cssText='display:flex;gap:calc('+(alto*.14)+' * var(--u));transform:skewX(-4deg)';
  const cifras=[];
  for(let i=0;i<digitos;i++){
    const s=document.createElementNS(ns,'svg');
    s.setAttribute('viewBox','0 0 60 100');
    s.style.cssText='height:calc('+alto+' * var(--u));width:calc('+(alto*.6)+' * var(--u));flex:none';
    const seg={};
    for(const k in SEG){
      const q=SEG[k], r=document.createElementNS(ns,'rect');
      r.setAttribute('x',q[0]);r.setAttribute('y',q[1]);r.setAttribute('width',q[2]);r.setAttribute('height',q[3]);
      r.setAttribute('rx',3);r.setAttribute('fill','rgba(190,200,215,.035)');
      s.appendChild(r); seg[k]=r;
    }
    cont.appendChild(s); cifras.push(seg);
  }
  let col=color, ult=null, ultV=0;
  const brillo=function(){
    cont.style.filter='drop-shadow(0 0 calc('+(alto/14)+' * var(--u)) '+col+')';
  };
  const poner=function(v,nuevoColor){
    if(nuevoColor){col=nuevoColor;ult=null;brillo();}
    if(v==null)v=ultV; else ultV=v;
    const txt=(typeof v==='string')?v:String(Math.max(0,v|0));
    const t2=(txt.length<digitos?'0'.repeat(digitos-txt.length)+txt:txt).slice(-digitos);
    if(t2===ult)return;
    for(let i=0;i<digitos;i++){
      const on=MAPA[t2[i]]||'', seg=cifras[i];
      for(const k in seg)seg[k].setAttribute('fill',on.indexOf(k)>=0?col:'rgba(190,200,215,.035)');
    }
    ult=t2;
  };
  brillo(); poner(0);
  return {el:cont,poner:poner};
}

/* Si hay precios en pantalla se cierran: estaban por encima de los carteles

/* El proximo escalon de la escalera de rangos: lo que convierte un golpe
   flojo en una meta alcanzable ("a 38 de PICANTE") en vez de un fracaso. */
function proximoRango(s){
  let prox=null;
  RANGOS.forEach(function(r){ if(r[0]>s&&(!prox||r[0]<prox[0]))prox=r; });
  return prox?{falta:prox[0]-s,nombre:prox[1]}:null;
}
const mismaPersona=function(a,b){
  return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
};
