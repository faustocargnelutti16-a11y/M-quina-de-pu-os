<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>BeerPunch · Tótem</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Oswald:wght@400;500;600;700&family=Grand+Hotel&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --rojo:#D7252A; --led:#FF2A2A; --oro:#FFD518; --azul:#3D55B8;
  --rosa:#F1437B; --rosaC:#FF8FB1; --teal:#2DD4BF;
  --texto:#fff; --suave:#C7CDD6; --tenue:#7F8796;
  --negra:'Archivo Black',Impact,sans-serif;
  --poster:'Anton','Arial Narrow',sans-serif;
  --cuerpo:'Oswald',sans-serif;
  --fem:'Playfair Display',Georgia,serif;
  --borde:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04050a;overflow:hidden;font-family:var(--cuerpo);color:#fff}

#marco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#app{position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:repeating-linear-gradient(180deg,#04050a 0,#04050a 5px,#07080d 5px,#07080d 6px);
  border:1px solid #16181f;transition:transform 2s linear}

/* ═══ cabecera ═══ */
#cab{padding:2.4% 4.5% 0;flex:none}
.fila{display:flex;align-items:center;justify-content:center;gap:2.6%}
#logo{width:6.4vh;height:6.4vh;flex:none;object-fit:contain}
.marca{font-family:var(--negra);font-size:4.4vh;line-height:1;letter-spacing:.5px;white-space:nowrap}
.marca .p{color:var(--rojo)}
#sub{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.3%;gap:8px}
#lema{color:var(--oro);letter-spacing:4px;font-weight:700;font-size:1.55vh;white-space:nowrap}
#reloj{color:#fff;font-weight:600;letter-spacing:1px;font-size:1.75vh;white-space:nowrap}
#reloj b{color:var(--oro);font-weight:600}
.regla{height:2px;margin-top:1.3%;border-radius:2px;
  background:linear-gradient(90deg,var(--rojo),transparent 72%)}

/* ═══ récord ═══ */
#recuadro{flex:none;margin:1.7% 4.5% 0;padding:1.7% 4%;border:1px solid rgba(215,37,42,.4);
  border-radius:15px;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(215,37,42,.15),rgba(0,0,0,.35) 74%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 54px -14px rgba(215,37,42,.45)}
.et{color:var(--suave);letter-spacing:6px;font-weight:700;font-size:1.75vh}
#recLed{display:flex;justify-content:center;margin:1% 0;min-height:7.6vh;align-items:center}
#recNom{font-family:var(--negra);font-size:2.9vh;letter-spacing:2px;color:#fff}
#recNom span{font-family:var(--cuerpo);font-weight:500;color:var(--suave);font-size:.62em;letter-spacing:1px}
#recPie{color:var(--oro);font-weight:700;letter-spacing:4px;font-size:2.1vh;margin-top:.4vh}

/* ═══ ticker ═══ */
#ticker{flex:none;margin:1.7% 4.5% 0;height:7.4%;border-radius:11px;overflow:hidden;
  background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  display:flex;align-items:center}
#ticker .caja{width:100%;padding:0 4%}
#ticker .top{display:flex;align-items:center;gap:9px}
#ticker .nom{font-weight:700;letter-spacing:2px;font-size:2.7vh;white-space:nowrap}
#ticker .ig{color:var(--suave);font-weight:500;font-size:1.5vh;flex:1;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
#ticker .ctx{color:var(--oro);font-weight:700;letter-spacing:1.5px;font-size:1.55vh;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker .idle{width:100%;text-align:center;font-weight:700;letter-spacing:4px;font-size:2vh;color:#fff}
@keyframes entra{0%{transform:translateX(110%);opacity:0}12%{transform:none;opacity:1}100%{transform:none;opacity:1}}
@keyframes suave{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ═══ ranking ═══ */
#rank{flex:1;margin:1.7% 4.5% 0;display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;gap:3px}
#tabs button{flex:1;padding:1.5% 0;border:none;border-radius:9px 9px 0 0;cursor:default;
  font-family:var(--cuerpo);font-weight:700;letter-spacing:1px;font-size:1.7vh;
  background:rgba(255,255,255,.06);color:var(--tenue)}
#tabs button.on{background:var(--oro);color:#000}
#tabs button.on.fem{background:var(--rosa);color:#fff}
#tabs button.fem{font-family:var(--fem);font-style:italic;font-size:1.85vh}
#panel{flex:1;border:1px solid var(--borde);border-top:2px solid var(--oro);border-radius:0 0 13px 13px;
  padding:1.5% 3%;display:flex;flex-direction:column;min-height:0;background:rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 28px -14px rgba(0,0,0,.75)}
#panel.fem{border-top-color:var(--rosa);
  background:radial-gradient(ellipse at 50% 0%,rgba(241,67,123,.1),rgba(0,0,0,.3) 74%)}
#premioEt{text-align:center;padding:1% 2%;margin-bottom:1%;border-radius:9px;
  background:rgba(255,213,24,.09);color:var(--oro);font-weight:700;letter-spacing:1.2px;font-size:1.6vh}
#panel.fem #premioEt{background:rgba(241,67,123,.12);color:var(--rosa);
  font-family:var(--fem);font-style:italic;letter-spacing:.3px;font-size:1.95vh}
#cuenta{text-align:center;font-weight:700;letter-spacing:2.5px;font-size:1.55vh;padding:.4% 0 .8%;color:#fff}
#cuenta b{color:var(--oro)}
#cuenta.urge b{color:var(--led)}
#filas{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.fil{display:flex;align-items:center;gap:3%;padding:.55% 3.5%;border-radius:9px;
  background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  border:1px solid transparent}
.fil.uno{border-color:rgba(255,213,24,.4)}
#panel.fem .fil{border-radius:20px;background:rgba(241,67,123,.06)}
#panel.fem .fil.uno{border-color:rgba(241,67,123,.45)}
.fil .pos{font-family:var(--negra);width:9%;text-align:center;font-size:2vh}
.fil .dat{flex:1;min-width:0}
.fil .n{display:block;font-weight:700;letter-spacing:1.4px;font-size:2.2vh;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel.fem .fil .n{font-family:var(--fem);font-style:italic;letter-spacing:.4px;font-size:2.4vh}
.fil .a{display:block;color:var(--suave);font-weight:500;font-size:1.25vh}
.fil.vacio{opacity:.42}
.fil.vacio .n{color:var(--tenue);letter-spacing:3px;font-weight:600}

/* ═══ zona baja ═══ */
#baja{flex:none;margin:1.7% 4.5%;height:17%;display:flex;gap:3%}
.card{flex:1;min-width:0;border-radius:17px;padding:1.6vh 3.5%;overflow:hidden;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 28px -14px rgba(0,0,0,.75)}
/* Ritmo vertical: cada bloque tiene su propio aire y ninguno se pega al de al
   lado. Antes el gap era porcentual y con textos largos se comía el espacio. */
.card .ceja{letter-spacing:3px;font-weight:700;font-size:1.4vh;text-transform:uppercase;
  margin-bottom:.9vh;opacity:.95}
.card h2{font-family:var(--poster);font-size:3vh;letter-spacing:.5px;line-height:1.04;
  text-transform:uppercase}
.card .mega{font-family:var(--poster);line-height:1;letter-spacing:1px;margin-top:.6vh;
  font-size:4.8vh;text-shadow:0 0 28px currentColor}
.card .fila2{display:flex;align-items:baseline;gap:1.2vh;flex-wrap:wrap;justify-content:center;
  margin-top:.7vh}
.card .big{font-family:var(--poster);font-size:2.7vh;letter-spacing:.4px;line-height:1}
.card .txt{color:var(--suave);font-weight:600;font-size:1.4vh;line-height:1.3;margin-top:.9vh;
  max-width:97%}
/* 14 caracteres en Archivo Black no entran a 3.6vh: la card mide ~29vh de
   ancho y el texto pedía 31. A 2.7vh con el tracking apretado, entra. */
.card .arroba{font-family:var(--negra);font-size:2.7vh;line-height:1.1;color:#fff;
  letter-spacing:-.3px;white-space:nowrap;margin-top:.6vh}
.card .arroba i{font-style:normal;color:var(--rojo)}
.vivo{display:inline-flex;align-items:center;gap:5px;background:var(--rojo);border-radius:999px;
  padding:2px 10px;font-weight:700;letter-spacing:1px;font-size:1.4vh}
.vivo i{width:6px;height:6px;border-radius:999px;background:#fff;animation:pal 1.2s ease-in-out infinite}
@keyframes pal{0%,100%{opacity:1}50%{opacity:.35}}
#qr{flex:none;width:35%;border-radius:17px;padding:3.4% 2.4%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4%;border:1px dashed rgba(45,212,191,.55);
  background:radial-gradient(120% 100% at 50% -20%,rgba(45,212,191,.17),rgba(7,9,16,.75) 66%),#080a12}
#qr svg{background:#fff;border-radius:8px;display:block}
#qr .t1{font-family:var(--poster);color:var(--teal);font-size:2.3vh;line-height:1.02}
#qr .t2{color:#fff;font-weight:600;font-size:1.35vh;letter-spacing:.8px;line-height:1.2;margin-top:3px}

/* ═══ overlays ═══ */
.over{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 8%}
@keyframes flash{0%{background:#fff}8%{background:#D7252A}16%{background:#fff}24%{background:#D7252A}
  32%{background:#fff}40%{background:#D7252A}52%{background:#fff}64%{background:#D7252A}
  100%{background:rgba(4,5,10,.97)}}
@keyframes estrobo{0%,100%{background:#000}50%{background:#D7252A}}
@keyframes aparece{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes cae{0%{transform:translateY(-5vh) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.7}}
@keyframes brilla{0%,100%{opacity:1}50%{opacity:.78}}
.papel{position:absolute;top:0;z-index:52;pointer-events:none;border-radius:2px}
#packs{position:absolute;inset:0;z-index:42;display:none;flex-direction:column;padding:4.6% 5% 4%;gap:2.6%;
  background:radial-gradient(120% 60% at 50% -5%,rgba(215,37,42,.18),rgba(4,5,10,.97) 60%),#04050a;
  animation:aparece .45s cubic-bezier(.22,1,.36,1)}
.pk{flex:1;min-width:0;border-radius:18px;padding:3% 2.4%;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;position:relative;border:2px solid}
.pk .tag{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);border-radius:999px;
  padding:.35em 1em;white-space:nowrap;font-weight:700;letter-spacing:1.1px;font-size:1.45vh}
.pk .cant{font-family:var(--poster);font-size:2.9vh;letter-spacing:.4px;color:#fff;margin-top:1%}
.pk .prec{font-family:var(--poster);font-size:4.4vh;line-height:1;color:var(--oro);
  text-shadow:0 0 26px rgba(255,213,24,.35)}
.pk .cu{color:var(--suave);font-weight:600;font-size:1.55vh}
.pk svg{background:#fff;border-radius:8px;display:block}
.pk .esc{color:var(--suave);font-weight:600;letter-spacing:2px;font-size:1.25vh}
@keyframes late{0%,100%{transform:none}50%{transform:scale(1.03)}}
.qrEnv{position:relative;border-radius:9px;overflow:hidden;animation:latQR 2.8s ease-in-out infinite}
@keyframes latQR{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.barrido{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.85) 50%,transparent 66%);
  animation:barre 2.8s ease-in-out infinite}
@keyframes barre{0%{transform:translateX(-150%)}55%,100%{transform:translateX(160%)}}

/* El puño no está quieto: respira, y cada tanto pega.
   perspective + rotateX hacen que venga de atrás hacia adelante. */
#logoCaja{position:relative;flex:none;perspective:420px;display:flex;align-items:center;justify-content:center}
#logo{transform-origin:50% 50%;will-change:transform;animation:respira 3.4s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(1) rotateX(0)}50%{transform:scale(1.045) rotateX(6deg)}}
#logo.pega{animation:impacto .62s cubic-bezier(.18,.9,.24,1)}
@keyframes impacto{
  0%{transform:translateZ(-120px) scale(.62) rotateX(26deg) rotateZ(-9deg)}
  38%{transform:translateZ(90px) scale(1.42) rotateX(-12deg) rotateZ(4deg)}
  52%{transform:translateZ(0) scale(.9) rotateX(4deg) rotateZ(-2deg)}
  70%{transform:scale(1.1) rotateX(-2deg)}
  100%{transform:scale(1) rotateX(0) rotateZ(0)}}
.onda{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  border:2px solid var(--rojo);opacity:0}
.onda.va{animation:expande .62s ease-out}
@keyframes expande{
  0%{transform:scale(.5);opacity:.95;border-width:4px}
  100%{transform:scale(2.9);opacity:0;border-width:1px}}
@keyframes alerta{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 54px -14px rgba(215,37,42,.5)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 74px -8px rgba(215,37,42,.95)}}

/* cupos que se agotan */
.fil.alerta{border-color:rgba(255,42,42,.5);background:rgba(215,37,42,.09);opacity:1}
.fil.alerta .n{color:var(--led)!important;letter-spacing:2.5px}
#avisoCupo,.avisoCupo{text-align:center;color:var(--led);font-weight:700;letter-spacing:3px;
  font-size:1.5vh;padding-top:.6%;animation:brilla 1.3s ease-in-out infinite}

/* panel de mujeres: desafío, no tabla */
.metaFem{text-align:center;padding:1.4% 0 .8%}
.metaFem .mL{color:var(--rosaC);font-weight:700;letter-spacing:3.5px;font-size:1.5vh}
.metaFem .mN{font-family:var(--poster);color:var(--rosa);font-size:8.2vh;line-height:1;
  text-shadow:0 0 34px rgba(241,67,123,.55)}
.listaFem{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.6%;padding:0 2%}
.listaFem .fL{text-align:center;color:var(--suave);font-weight:600;letter-spacing:2.5px;font-size:1.4vh}
.filF{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.6% 4%;
  border-radius:20px;background:rgba(241,67,123,.08)}
.filF .n{font-family:var(--fem);font-style:italic;font-weight:700;font-size:2.3vh;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fVacio{text-align:center;font-family:var(--fem);font-style:italic;color:var(--rosaC);
  font-size:2.6vh;font-weight:700}
.reina{text-align:center;padding:1.4% 0 .6%;border-top:1px solid rgba(241,67,123,.25)}
.reina .rL{display:block;color:var(--rosaC);font-weight:700;letter-spacing:3.5px;font-size:1.35vh}
.reina .rN{display:block;font-family:var(--fem);font-style:italic;font-weight:700;
  color:#fff;font-size:3vh;line-height:1.15}
.reina .rP{display:block;color:var(--suave);font-weight:500;font-size:1.35vh;letter-spacing:1px}

</style>
</head>
<body>
<div id="marco"><div id="app"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════
   BEERPUNCH · TÓTEM
   Sin React. Un solo archivo. La verdad vive en el servidor.
   ══════════════════════════════════════════════════════════════ */
const CFG = {
  API:'',                       // '' = mismo origen. Ej: 'https://beerpunch.onrender.com'
  ROTAR_90:false,               // true si el TV Box NO rota la salida de video
  SONIDO:true,

  IG:'@beerpunch.mdz',
  URL_IG:'https://instagram.com/beerpunch.mdz',
  URL_CARGA:'',                 // '' = usa el origen + /m

  /* Payloads EMV de Mercado Pago, idénticos a los del cartel impreso.
     Formato EMV interoperable: los lee cualquier billetera, no solo MP. */
  PAGO:{
    1 :'00020101021143540016com.mercadolibre0130https://mpago.la/pos/13305392450150011202266297355204970053030325802AR5919Claudio Cargnelutti6004CABA6304E740',
    3 :'00020101021143540016com.mercadolibre0130https://mpago.la/pos/13409647350150011202266297355204970053030325802AR5919Claudio Cargnelutti6004CABA630451D6',
    8 :'00020101021143540016com.mercadolibre0130https://mpago.la/pos/13409649950150011202266297355204970053030325802AR5919Claudio Cargnelutti6004CABA630466B5',
    20:'00020101021143540016com.mercadolibre0130https://mpago.la/pos/13409651550150011202266297355204970053030325802AR5919Claudio Cargnelutti6004CABA6304FC45'
  },

  HAPPY:{ desde:17, hasta:21 }, // 17 a 21, solo tiros
  PREMIO_RECORD_ACTIVO:false,   // el récord histórico todavía no paga
  TOP:10
};

const T = {                     // tiempos, todo en un solo lugar
  reloj:15000, tab:9000, card:9000, header:9000, idle:5000,
  packsCada:110000, packsDura:18000,
  revancha:7000, recordCierra:5600, golpeVisible:60000,
  antiQuema:60000
};

const PRECIOS = [
  {n:1, precio:'$2.000', tag:'HAPPY HOUR', color:'#F59E0B', nota:'PAGÁS 1, TIRÁS 2', extra:'17 a 21 h'},
  {n:3, precio:'$5.500', tag:'SOLO CON QR', color:'#9CA3AF', nota:'$1.833 cada tiro'},
  {n:8, precio:'$10.000', tag:'EL MÁS PEDIDO', color:'#D7252A', nota:'$1.250 cada tiro', hero:true},
  {n:20, precio:'$20.000', tag:'MEJOR PRECIO', color:'#FFD518', nota:'$1.000 cada tiro'}
];

const RANGOS=[[830,'CAMPEÓN'],[750,'LEYENDA'],[650,'BESTIA'],[550,'PELIGROSO'],[450,'PICANTE'],[0,'PRECALENTANDO']];
const rango=s=>RANGOS.find(([m])=>s>=m)[1];
const $=(s,c)=>(c||document).querySelector(s);
const cre=(t,cl,txt)=>{const e=document.createElement(t);if(cl)e.className=cl;if(txt!=null)e.textContent=txt;return e;};

/* ────────── QR (generador propio, sin librerías ni red) ────────── */
const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
(()=>{let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=285;}
  for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
const mul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
function genPoly(n){let p=[1];for(let i=0;i<n;i++){const q=new Array(p.length+1).fill(0);
  for(let j=0;j<p.length;j++){q[j]^=mul(p[j],EXP[i]);q[j+1]^=p[j];}p=q;}return p.reverse();}
function rs(data,n){const g=genPoly(n),r=new Array(n).fill(0);
  for(const d of data){const f=d^r[0];r.shift();r.push(0);
    if(f!==0)for(let i=0;i<g.length-1;i++)r[i]^=mul(g[i+1],f);}return r;}
const VER={1:[26,10,1,16,0,0],2:[44,16,1,28,0,0],3:[70,26,1,44,0,0],4:[100,18,2,32,0,0],
  5:[134,24,2,43,0,0],6:[172,16,4,27,0,0],7:[196,18,4,31,0,0],8:[242,22,2,38,2,39],
  9:[292,22,3,36,2,37],10:[346,26,4,43,1,44]};
const ALI={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
function cap(v){const[,,b1,d1,b2,d2]=VER[v];return Math.floor(((b1*d1+b2*d2)*8-4-(v<10?8:16))/8);}
function verPara(n){for(let v=1;v<=10;v++)if(cap(v)>=n)return v;throw new Error('texto muy largo');}
function fmtBits(m){let l=m|0,e=l;for(let i=0;i<10;i++)e=(e<<1)^(((e>>9)&1)*1335);return((l<<10)|e)^21522;}
function verBits(v){let l=v;for(let i=0;i<12;i++)l=(l<<1)^(((l>>11)&1)*7973);return(v<<12)|l;}
function qrMatrix(txt){
  const bytes=new TextEncoder().encode(txt), v=verPara(bytes.length);
  const[,ec,b1,d1,b2,d2]=VER[v], size=17+v*4, bits=[];
  const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1);};
  put(4,4); put(bytes.length,v<10?8:16);
  for(const b of bytes)put(b,8);
  const totalBits=(b1*d1+b2*d2)*8;
  put(0,Math.min(4,totalBits-bits.length));

  e:[0,52,11,41],c:[49,52,11,41],d:[9,89,42,11]};
const MAPA={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd',
  '6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
function led(valor,alturaVh,color){
  const cont=cre('div');
  cont.style.cssText=`display:flex;gap:${alturaVh*.14}vh;transform:skewX(-4deg)`;
  String(valor).split('').forEach(ch=>{
    const on=MAPA[ch]||'';
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 60 100');
    s.style.cssText=`height:${alturaVh}vh;width:${alturaVh*.6}vh;flex:none;
      filter:drop-shadow(0 0 ${alturaVh/14}vh ${color})`;
    for(const k in SEG){const[x,y,w,h]=SEG[k];

let AC=null;
const ac=()=>{if(!CFG.SONIDO)return null;
  if(!AC){const K=window.AudioContext||window.webkitAudioContext;if(K)AC=new K();}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;};
function golpeSonido(){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(140,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(48,a.currentTime+.24);
  g.gain.setValueAtTime(.32,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.34);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.36);
}
function recordSonido(){
  const a=ac();if(!a)return;
  [392,523,659,784,1047].forEach((hz,i)=>{
    const t=a.currentTime+i*.11;
    [0,.06].forEach((d,k)=>{
      const o=a.createOscillator(),g=a.createGain();
      o.type='triangle';o.frequency.value=hz;
      g.gain.setValueAtTime(.0001,t+d);
      g.gain.exponentialRampToValueAtTime(k?.1:.26,t+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+d+.6);
      o.connect(g).connect(a.destination);o.start(t+d);o.stop(t+d+.7);});});
}

function entrega(){
  const d=new Date();
  const dia=d.getHours()<6?(d.getDay()+6)%7:d.getDay();
  const h=(dia===4||dia===5||dia===6)?4:3;
  const t=new Date(d); if(d.getHours()>=6)t.setDate(t.getDate()+1);
  t.setHours(h,0,0,0);
  const ms=t-d, min=Math.max(0,Math.floor(ms/60000));
  return {label:`${h} AM`,h:Math.floor(min/60),m:min%60,urge:ms>0&&min<=60,pasado:ms<=0};
}
const esHappy=()=>{const h=new Date().getHours();return h>=CFG.HAPPY.desde&&h<CFG.HAPPY.hasta;};
function piñasMostradas(){
  const d=new Date(), dia=d.getHours()<6?(d.getDay()+6)%7:d.getDay();
  if(![4,5,6].includes(dia)||S.piñas<4)return null;
  const inflado=S.piñas*(1+1.4*Math.exp(-S.piñas/30));
  return Math.ceil(inflado/2)*2;
}

/* ─── proporción 9:16 + rotación opcional ─── */
function medir(){
  const W=window.innerWidth,H=window.innerHeight;
  let w,h;
  if(CFG.ROTAR_90){ h=Math.min(W,H*9/16); w=h*16/9;
    app.style.width=h+'px'; app.style.height=w+'px';
    app.style.transform=`rotate(90deg) translate(${S.qx||0}px,${S.qy||0}px)`;
  }else{ h=Math.min(H,W*16/9); w=h*9/16;
    app.style.width=w+'px'; app.style.height=h+'px';
    app.style.transform=`translate(${S.qx||0}px,${S.qy||0}px)`;
  }
}
window.addEventListener('resize',medir); medir();

/* ─── anti burn-in: 8 h por noche queman el panel ─── */
setInterval(()=>{S.qx=Math.round((Math.random()-.5)*8);S.qy=Math.round((Math.random()-.5)*8);medir();},T.antiQuema);

/* ─── wake lock: que no se duerma la pantalla ─── */
(async function(){let wl=null;
  const pedir=async()=>{try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen');}catch(e){}};
  pedir();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pedir();});})();

/* ────────── cabecera ────────── */
function pintarReloj(){
  const d=new Date();
  const dia=d.toLocaleDateString('es-AR',{weekday:'long'}).toUpperCase();
  const hh=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('#reloj').innerHTML=`${dia} · <b>${hh} HS</b>`;
}
function pintarLema(){
  const p=piñasMostradas();
  const l=$('#lema');
  if(p&&S.headerAlt%2===1){
    l.innerHTML=`<span style="font-family:var(--poster);color:var(--oro);font-size:2.2vh">${p}</span>
      <span style="color:var(--suave);letter-spacing:3px;font-size:1.35vh">PIÑAS HOY</span>`;
  }else{
    l.textContent='LA PIÑA DEL BAR';
  }
}
setInterval(()=>{pintarReloj();},T.reloj); pintarReloj();

/* El golpe del logo. Se dispara solo cada tanto para que la pantalla
   nunca esté del todo quieta, y de verdad cuando alguien pega. */
function golpearLogo(){
  const l=$('#logo'); if(!l)return;
  l.classList.remove('pega'); void l.offsetWidth; l.classList.add('pega');
  [$('#onda1'),$('#onda2')].forEach((o,i)=>{
    if(!o)return;
    setTimeout(()=>{o.classList.remove('va');void o.offsetWidth;o.classList.add('va');},i*130);
  });
}
setInterval(golpearLogo, 13000);
setTimeout(golpearLogo, 1200);
setInterval(()=>{S.headerAlt++;pintarLema();},T.header); pintarLema();

/* ────────── récord ────────── */
function pintarRecord(){
  const led1=$('#recLed'); led1.innerHTML='';
  const caja=$('#recuadro');
  if(apertura()){
    /* nadie pegó todavía: alerta roja, no gris apagado */
    caja.style.borderColor='rgba(215,37,42,.85)';
    caja.style.background='radial-gradient(ellipse at 50% 0%,rgba(215,37,42,.3),rgba(0,0,0,.35) 74%)';
    caja.style.animation='alerta 1.6s ease-in-out infinite';
    $('#recEt').textContent='RÉCORD DE LA NOCHE';
    const v=cre('div','','SIN RÉCORD');
    v.style.cssText='font-family:var(--poster);font-size:6.4vh;color:var(--led);letter-spacing:2px;line-height:1;text-shadow:0 0 26px rgba(255,42,42,.7)';
    led1.appendChild(v);
    $('#recNom').textContent='';
    $('#recPie').style.color='var(--led)';
    $('#recPie').textContent='SÉ EL PRIMERO EN SALIR EN PANTALLA';
  }else{
    caja.style.borderColor='rgba(215,37,42,.4)';
    caja.style.background='radial-gradient(ellipse at 50% 0%,rgba(215,37,42,.15),rgba(0,0,0,.35) 74%)';
    caja.style.animation='none';
    $('#recEt').textContent='EL MEJOR DE ESTA NOCHE';
    const l=led(S.record.score,7.6,'#FF2A2A');
    l.style.animation='brilla 2.6s ease-in-out infinite';
    led1.appendChild(l);
    /* textContent y no innerHTML: el apodo lo escribe un desconocido. */
    $('#recNom').textContent='— ' + (S.record.nombre || 'ANÓNIMO') + ' —';
    $('#recPie').style.color='var(--oro)';
    /* La cifra grande tiene que ser alcanzable. El récord de la casa va
       abajo y chico: sirve de horizonte, no de meta de la noche. */
    if(S.casa.score && S.casa.score>S.record.score){
      $('#recPie').innerHTML=`¿LE GANÁS? &nbsp;·&nbsp; <span style="color:var(--suave);font-weight:600;letter-spacing:2px;font-size:.72em">RÉCORD DE LA CASA ${S.casa.score} (${S.casa.nombre})</span>`;
    }else if(S.casa.score){
      $('#recPie').innerHTML='RÉCORD DE LA CASA &nbsp;·&nbsp; <span style="color:var(--oro)">NADIE LE GANÓ TODAVÍA</span>';
    }else{
      $('#recPie').textContent='¿LE GANÁS?';
    }
  }
}

/* ────────── ticker ────────── */
const IDLES=()=>[
  S.record.score?`MEJOR DE HOY: ${S.record.score} · ¿LO BAJÁS?`:'SÉ EL PRIMERO EN SALIR EN PANTALLA',
  'PEGÁ FUERTE Y AL CENTRO',
  'EL PEOR DE LA RONDA PAGA',
  'FILMATE Y TE DEVOLVEMOS $2.000',
  '¿TE ANIMÁS?'
];
let idleIdx=0;
function pintarTicker(){
  const t=$('#ticker'); t.innerHTML='';
  const reciente=S.ultimo&&(Date.now()-S.ultimoTs)<T.golpeVisible;
  if(reciente){
    const c=cre('div','caja'); c.style.animation='entra 6s ease forwards';
    const top=cre('div','top');
    top.appendChild(cre('span','nom',S.ultimo.nombre||'ANÓNIMO'));
    top.appendChild(cre('span','ig',S.ultimo.ig||''));
    top.appendChild(led(S.ultimo.score,3.4,'#FFD518'));
    c.appendChild(top);
    c.appendChild(cre('div','ctx',S.ultimo.ctx||rango(S.ultimo.score)));
    t.appendChild(c);
  }else{
    const l=IDLES(); const d=cre('div','idle',l[idleIdx%l.length]);
    d.style.animation='suave 5s ease forwards'; t.appendChild(d);
  }
}
setInterval(()=>{idleIdx++;pintarTicker();},T.idle);

/* ────────── ranking ────────── */
const TABS=[
  {id:'noche',   label:'NOCHE',    premio:'GANADOR DE LA NOCHE: 1 BIRRA'},
  {id:'mujeres', label:'Mujeres',  fem:true, premio:'EL MEJOR PUNTAJE DE LA NOCHE SE LLEVA LA BIRRITA'},
  {id:'historico',label:'HISTÓRICO',premio:CFG.PREMIO_RECORD_ACTIVO
      ?'ROMPÉ EL RÉCORD DE LA CASA: 10 PINTAS'
      :'EL MEJOR GOLPE DE LA HISTORIA DEL BEERLIN'}
];
function pintarTabs(){
  const c=$('#tabs'); c.innerHTML='';
  TABS.forEach((t,i)=>{
    c.appendChild(cre('button',(i===S.tab?'on ':'')+(t.fem?'fem':''),t.label));
  });
}

/* Los lugares se abren de a dos: arrancás viendo 5, y a medida que se
   llenan aparecen los siguientes hasta 10. Los renglones se achican solos.
   Cuando quedan pocos libres, se ponen en alerta: "quedan 2 lugares". */
function cupos(n){ return Math.max(5, Math.min(CFG.TOP, n+2)); }

function pintarRanking(){
  const t=TABS[S.tab], fem=!!t.fem;
  $('#panel').className=fem?'fem':'';
  $('#premioEt').textContent=t.premio;
  const c=$('#cuenta'), f=$('#filas'); f.innerHTML='';

  if(t.id==='noche'||t.id==='mujeres'){
    const e=entrega(); c.style.display='block'; c.className=e.urge?'urge':'';
    c.innerHTML=e.pasado?'PREMIO ENTREGADO — ARRANCA UNA NOCHE NUEVA'
      :`PREMIO A LAS ${e.label} — FALTAN <b>${e.h}H ${String(e.m).padStart(2,'0')}M</b>`;
  }else c.style.display='none';

  /* ─── NOCHE / HISTÓRICO ─── */
  const lista=S.rk[t.id]||[];
  const oro=fem?'#F1437B':'#FFD518', led2=fem?'#ff7aa8':'#FF2A2A';
  const vis=cupos(lista.length);
  const libres=vis-lista.length;
  const alerta=vis>=8&&libres>0;
  const fs=(2.35-(vis-5)*0.135).toFixed(2);   // el renglón se achica al abrirse más cupos
  const fled=(2.75-(vis-5)*0.14);
  for(let i=0;i<vis;i++){
    const e=lista[i];
    const row=cre('div','fil'+(i===0&&e?' uno':'')+(e?'':' vacio')+(!e&&alerta?' alerta':''));
    const pos=cre('span','pos',String(i+1));
    pos.style.color=e?(i===0?oro:i===1?'#cbd5e1':i===2?'#b45309':'#4b5563'):(alerta?'#FF2A2A':'#3a4150');
    row.appendChild(pos);
    const dat=cre('div','dat');
    const n=cre('span','n',e?e.nombre:(alerta?'LUGAR LIBRE':(fem?'— SÉ LA PRIMERA —':'— TU NOMBRE ACÁ —')));
    n.style.fontSize=fs+'vh';
    dat.appendChild(n);
    if(e&&e.ig)dat.appendChild(cre('span','a',e.ig));
    row.appendChild(dat);
    if(e)row.appendChild(led(e.score,fled,i===0?oro:led2));
    f.appendChild(row);
  }
  /* El que quedó justo afuera del top 5 es el que más cerca está de comprar
     otro tiro. Se le dice el número exacto que le falta. */
  if(t.id!=='historico' && lista.length>=5 && lista[4]){
    const corte=lista[4].score;
    const af=cre('div','avisoCupo','CON '+(corte+1)+' PUNTOS ENTRÁS AL TOP 5');
    af.style.color='var(--oro)';
    f.appendChild(af);
  }
  if(alerta){
    const av=cre('div','avisoCupo',
      libres===1?'QUEDA 1 LUGAR EN EL TOP 10':`QUEDAN ${libres} LUGARES EN EL TOP 10`);
    f.appendChild(av);
  }
}
setInterval(()=>{if(S.ocupado||S.packsAbierto)return;S.tab=(S.tab+1)%TABS.length;pintarTabs();pintarRanking();},T.tab);

/* ────────── zona baja: cards rotativas ────────── */
/* glifo oficial de Instagram con su degradé de marca */
let igN=0;
function igSVG(em){
  const id='igg'+(++igN);
  return `<svg viewBox="0 0 24 24" style="width:100%;height:100%;display:block">
    <defs><radialGradient id="${id}" cx="28%" cy="106%" r="140%">
      <stop offset="0" stop-color="#FFD600"/><stop offset=".18" stop-color="#FF7A00"/>
      <stop offset=".42" stop-color="#FF0069"/><stop offset=".7" stop-color="#D300C5"/>
      <stop offset="1" stop-color="#7638FA"/></radialGradient></defs>
    <rect x="1" y="1" width="22" height="22" rx="6.4" fill="url(#${id})"/>
    <rect x="4.6" y="4.6" width="14.8" height="14.8" rx="4.4" fill="none" stroke="#fff" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="3.7" fill="none" stroke="#fff" stroke-width="1.8"/>
    <circle cx="17.1" cy="6.9" r="1.15" fill="#fff"/></svg>`;
}
/* Un "hasta las 21" no apura a nadie; un "termina en 47 min" sí.
   El AHORA amarillo salió de la cejilla: ya está la pastilla roja abajo. */
function faltaHappy(){
  const d=new Date();
  const min=(CFG.HAPPY.hasta*60)-(d.getHours()*60+d.getMinutes());
  if(min<=0)return 'ÚLTIMOS MINUTOS';
  if(min<=30)return 'ÚLTIMOS '+min+' MINUTOS';
  const h=Math.floor(min/60), m=min%60;
  return h?('TERMINA EN '+h+' H '+String(m).padStart(2,'0')+' MIN'):('TERMINA EN '+m+' MIN');
}
function cardHappy(){return{
  ceja:faltaHappy(), vivo:true, urgente:true, color:'#FFD518',
  tituloHTML:'HAPPY <span style="color:#fff">BEER</span><span style="color:var(--rojo)">PUNCH</span>',
  destacado:'2 PIÑAS', precio:'$2.000'};}
/* Los últimos 45 minutos antes de entregar la birra son el momento de más
   conversión de la noche: el que está #6 sabe que se le escapa y todavía
   puede comprar tiros. Antes ahí no pasaba nada especial. */
const ULTIMA_HORA_MIN = 45;
function esUltimaHora(){ const e=entrega(); return !e.pasado && (e.h*60+e.m)<=ULTIMA_HORA_MIN; }

function cardUltimaHora(){
  const e=entrega(), l=S.rk.noche[0], sexto=S.rk.noche[4];
  /* Cinco bloques no entran en la card. El reloj es el mensaje; el resto
     va en una sola línea de apoyo. */
  return {
    ceja:'Última hora · se entrega en', vivo:true, color:'#FF2A2A',
    mega:`${e.h?e.h+'H ':''}${String(e.m).padStart(2,'0')}M`,
    txt: l ? (sexto ? `${l.nombre} va ganando con ${l.score} · el top 5 cierra en ${sexto.score}`
                    : `${l.nombre} va ganando con ${l.score} puntos`)
           : 'la birra sigue sin dueño'
  };
}
/* Loss aversion: al que va ganando se le avisa que se la están por sacar.
   Defender algo motiva más que ganarlo, y el que defiende también compra. */
function cardEnRiesgo(){
  const a=S.rk.noche[0], b=S.rk.noche[1];
  if(!a||!b) return null;
  const dif=a.score-b.score;
  if(dif>25) return null;
  return { ceja:'La birra está en juego', color:'#FF2A2A',
    titulo:`${a.nombre} LA GANA`, mega:`POR ${dif}`,
    destacado:'PUNTOS', txt:`${b.nombre} está a un golpe de sacársela` };
}

const CARDS=[
  ()=>({ceja:'Filmá tu piña y subila',color:'#D7252A',ig:true,
    titulo:'TE DEVOLVEMOS', mega:'$2.000',
    txt:`Etiquetanos ${CFG.IG}`}),
  ()=>{
    const l=S.rk.noche[0];
    return l?{ceja:'La birra de esta noche',color:'#FFD518',
      titulo:'TIENE DUEÑO', destacado:l.nombre, txt:`con ${l.score} puntos`}
    :{ceja:'La birra de esta noche',color:'#FFD518',
      titulo:'NO TIENE DUEÑO', destacado:'TODAVÍA',
      txt:'sé el primero en salir en pantalla'};
  },
  /* Misma estructura que las demás: cejilla, título, héroe, pie.
     Que sea especial era justamente lo que la hacía verse descolgada. */
  ()=>({tituloArriba:'SEGUINOS', igMarca:true, color:'#D300C5',
    arroba:true, txt:'RÉCORDS · BLOOPERS · DESAFÍOS'})
];
function pintarCard(){
  /* Prioridad: última hora > happy hour > birra en riesgo > rotación.
     Ocho horas con las mismas cinco tarjetas cansan; el contenido tiene que
     seguir el momento de la noche. */
  let d;
  const otra=()=>{
    const riesgo=(S.card%3===2)?cardEnRiesgo():null;
    return riesgo || CARDS[S.card%CARDS.length]();
  };
  if(esUltimaHora())      d=cardUltimaHora();
  /* El happy manda, pero uno de cada dos. Antes, entre las 17 y las 21 era
     el UNICO cartel: las otras tres no se veian nunca, justo en las cuatro
     horas en que el bar se llena. */
  else if(esHappy())      d=(S.card%2===0)?cardHappy():otra();
  else                    d=otra();
  const c=$('#card');
  c.style.animation='none'; void c.offsetWidth;
  c.style.animation='pop .5s cubic-bezier(.22,1,.36,1)' +
    (d.urgente?', late 2.4s ease-in-out .5s infinite':'');
  c.style.cssText=`border:1px solid ${d.color}66;background:radial-gradient(120% 100% at 50% -20%,${d.color}22,rgba(7,9,16,.75) 66%),#080a12`;
  c.innerHTML='';
  /* "SEGUINOS" es la orden y va arriba de todo; la marca es la aclaración
     de dónde, y va abajo. Al revés se leía como un cartel de Instagram. */
  if(d.tituloArriba){
    const t=cre('h2','',d.tituloArriba);
    t.style.marginBottom='.7vh';
    c.appendChild(t);
  }
  if(d.igMarca){
    const w=cre('div','');
    w.style.cssText='display:inline-flex;align-items:center;gap:.7vh;margin-bottom:.2vh';
    w.innerHTML='<span style="display:inline-block;width:2.4vh;height:2.4vh">'+igSVG()+'</span>'+
      '<span style="font-family:\'Grand Hotel\',cursive;font-size:2.8vh;color:#fff;line-height:1">Instagram</span>';
    c.appendChild(w);
  }
  const cj=cre('div',''); cj.style.cssText='display:flex;align-items:center;justify-content:center;gap:8px';
  const e1=cre('div','ceja'); e1.style.color=d.color;
  if(d.igCeja){
    /* El ícono acompaña a la palabra, no la reemplaza ni compite con ella. */
    e1.innerHTML='<span style="display:inline-flex;align-items:center;gap:.6vh">'+
      '<span style="display:inline-block;width:2.2vh;height:2.2vh">'+igSVG()+'</span>'+
      '<span style="font-family:\'Grand Hotel\',cursive;font-size:2.6vh;color:#fff;'+
        'letter-spacing:0;text-transform:none;line-height:1">Instagram</span></span>';
  }else{
    e1.innerHTML=(d.ig?'<span style="display:inline-block;width:1.9vh;height:1.9vh;vertical-align:-.35vh;margin-right:.5vh">'+igSVG()+'</span>':'')+d.ceja;
  }
  if(d.ceja)cj.appendChild(e1);
  if(d.vivo){const v=cre('span','vivo');v.appendChild(cre('i'));v.appendChild(document.createTextNode('AHORA'));cj.appendChild(v);}
  c.appendChild(cj);
  if(d.tituloHTML){const h2=cre('h2');h2.innerHTML=d.tituloHTML;c.appendChild(h2);}
  else if(d.titulo)c.appendChild(cre('h2','',d.titulo));
  if(d.arroba){
    const a=cre('div','arroba');
    a.innerHTML='@beer<i>punch</i>.mdz';
    c.appendChild(a);
  }
  if(d.mega){
    const m=cre('div','mega',d.mega); m.style.color=d.color;
    if(d.mega.length>8)m.style.fontSize='3.4vh';       // frases: más chico que un precio
    c.appendChild(m);
  }
  if(d.destacado||d.precio){
    const r=cre('div','fila2');
    if(d.destacado){const b=cre('span','big',d.destacado);b.style.color=d.color;r.appendChild(b);}
    if(d.precio){const p=cre('span','big',d.precio);p.style.color='#fff';r.appendChild(p);}
    c.appendChild(r);
  }
  if(d.txt)c.appendChild(cre('div','txt',d.txt));
}
setInterval(()=>{if(S.ocupado||S.packsAbierto)return;S.card++;pintarCard();},T.card);

/* ────────── takeover de precios ────────── */
/* Fuera del happy, el pack de 1 NO puede seguir diciendo "pagás 1, tirás 2":
   a esa hora el servidor entrega una sola ficha (fichasPorMonto), así que el
   cartel estaría prometiendo algo que la máquina no da. */
function preciosAhora(){
  const lista=PRECIOS.map(x=>Object.assign({},x));
  if(!esHappy()){
    lista[0].tag='1 TIRO';
    lista[0].color='#9CA3AF';
    lista[0].nota='$2.000 el tiro';
    lista[0].extra='';
  }
  return lista;
}

  const PRECIOS_HOY=preciosAhora();
  const p=$('#packs'); p.innerHTML='';
  const cab=cre('div'); cab.style.textAlign='center';

  f.appendChild(ti); cab.appendChild(f);

  cab.appendChild(sub); p.appendChild(cab);

  const grid=cre('div'); grid.style.cssText='flex:1;display:flex;flex-direction:column;gap:4.4%;min-height:0';
  for(let r=0;r<2;r++){

    for(let k=0;k<2;k++){

      card.style.borderColor=d.color;
      card.style.background=`radial-gradient(120% 90% at 50% -10%,${d.color}${d.hero?'33':'1f'},rgba(7,9,16,.9) 62%),#07090f`;
      card.style.boxShadow=`0 0 ${d.hero?46:30}px ${d.hero?'-12':'-22'}px ${d.color}`;
      if(d.hero)card.style.animation='late 2.6s ease-in-out infinite';
      const tag=cre('span','tag',d.tag);
      tag.style.cssText+=`background:${d.color};color:${d.n===3?'#111':'#fff'}`;
      card.appendChild(tag);
      card.appendChild(cre('div','cant',`${d.n} ${d.n===1?'TIRO':'TIROS'}`));
      card.appendChild(cre('div','prec',d.precio));
      const nota=cre('div','cu',d.nota); if(d.extra){nota.textContent=d.nota+' · '+d.extra;} card.appendChild(nota);
      const link=CFG.PAGO[d.n];
      const sv=link?qrSVG(link,Math.round(window.innerHeight*.088)):null;
      if(sv){
        /* Un QR quieto en una pantalla es un cuadrito más. Con el barrido
           de luz encima el ojo lo lee como "esto se usa". */
        const env=cre('div','qrEnv'); env.appendChild(sv);
        const br=cre('span','barrido'); br.style.animationDelay=(0.4+(r*2+k)*0.5)+'s';
        env.appendChild(br); card.appendChild(env);
        card.appendChild(cre('div','esc','ESCANEÁ Y PAGÁ'));
      }
      else{const ef=cre('div','esc','EFECTIVO EN LA CAJA');ef.style.padding='2.4vh 0';card.appendChild(ef);}
      fila.appendChild(card);
    }
    grid.appendChild(fila);
  }
  p.appendChild(grid);
  const pie=cre('div',''); pie.style.cssText='text-align:center;border-radius:12px;padding:2% 4%;border:1px solid rgba(255,213,24,.55);background:rgba(255,213,24,.07)';
  pie.innerHTML='<div style="font-family:var(--poster);font-size:3.2vh;line-height:1">'+
    'EFECTIVO O <span style="color:var(--oro)">QR</span> · MISMO PRECIO</div>'+
    '<div style="font-family:var(--cuerpo);font-weight:600;font-size:1.6vh;color:var(--suave);'+
    'letter-spacing:.5px;margin-top:.7vh">El pack de 3 tiros está disponible solo con QR</div>';
  p.appendChild(pie);

setInterval(()=>{
  if(S.ocupado||S.packsAbierto)return;

/* ────────── overlays ────────── */
function papeles(){
  for(let i=0;i<50;i++){
    const p=cre('div','papel');
    const col=['#FFD518','#D7252A','#fff'][i%3], size=6+Math.random()*8;
    p.style.cssText=`left:${Math.random()*100}%;width:${size}px;height:${size*.6}px;background:${col};
      transform:rotate(${Math.random()*360}deg);
      animation:cae ${2.2+Math.random()*1.5}s ease-in ${Math.random()*.8}s forwards`;
    app.appendChild(p); setTimeout(()=>p.remove(),4600);
  }
}
function overRevancha(hit,pos,faltan){
  S.ocupado=true; golpeSonido();
  const o=cre('div','over');
  o.style.animation='flash 2200ms ease-out forwards, aparece 380ms cubic-bezier(.22,1,.36,1)';
  const gana=pos>0, col=gana?'#FFD518':'#D7252A';

    <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 50% 40%,${col}26,transparent 62%)"></div>
    <div style="color:var(--suave);font-weight:700;letter-spacing:6px;font-size:1.9vh">TU PIÑA</div>
    <div style="font-family:var(--negra);font-size:5.2vh;letter-spacing:1px;margin-top:2%;line-height:1">${hit.nombre||'ANÓNIMO'}</div>
    <div id="ledBig" style="margin:5% 0"></div>
    ${gana
      ? `<div style="font-family:var(--poster);color:var(--oro);font-size:5.6vh;line-height:1">ENTRASTE #${pos}</div>
         <div style="font-weight:700;letter-spacing:3px;font-size:2.2vh;margin-top:3%">DE LA NOCHE</div>`
      : `<div style="font-weight:700;letter-spacing:3px;font-size:2.2vh">TE FALTARON</div>
         <div style="display:flex;align-items:baseline;gap:10px;justify-content:center;margin-top:1%">
           <span style="font-family:var(--poster);color:var(--rojo);font-size:7.2vh;line-height:1">${faltan}</span>
           <span style="font-family:var(--poster);font-size:3vh">PUNTOS</span></div>
         <div style="color:var(--suave);font-weight:700;letter-spacing:3px;font-size:1.7vh;margin-top:2%">PARA ENTRAR AL TOP</div>`}
    <div style="margin-top:7%;padding:2.5% 7%;border-radius:999px;border:2px solid var(--oro);
      background:rgba(255,213,24,.1);font-family:var(--poster);color:var(--oro);letter-spacing:2px;
      font-size:4.6vh;animation:brilla 1.4s ease-in-out infinite">¿OTRA?</div>`;
  app.appendChild(o);
  $('#ledBig',o).appendChild(led(hit.score,15,col));
  papeles();
  setTimeout(()=>{o.remove();S.ocupado=false;},T.revancha);
}
function overRecord(hit,previo){
  S.ocupado=true; recordSonido();
  const o=cre('div','over');
  o.style.cssText+='background:#000;animation:estrobo .35s ease 3';
  o.innerHTML=`
    <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(255,213,24,.1),transparent 60%)"></div>
    <div style="display:flex;flex-direction:column;align-items:center;animation:aparece .5s cubic-bezier(.22,1,.36,1)">
      <img src="${$('#logo').src}" style="width:8.5vh;height:8.5vh;object-fit:contain">
      <div style="font-family:var(--negra);color:var(--oro);letter-spacing:2px;font-size:4.4vh;margin-top:3%">¡NUEVO RÉCORD!</div>
      <div id="ledRec" style="margin:5% 0"></div>
      <div style="font-family:var(--negra);letter-spacing:2px;font-size:3.6vh">${hit.nombre||'ANÓNIMO'}</div>
      <div style="color:var(--suave);font-weight:500;letter-spacing:1px;font-size:1.6vh;margin-top:1%">${hit.ig||''}</div>
      <div style="font-weight:700;color:var(--rojo);letter-spacing:4px;font-size:2vh;margin-top:3%">NUEVO CAMPEÓN DE LA CASA</div>
      <div style="color:var(--suave);font-weight:500;letter-spacing:2px;font-size:1.6vh;margin-top:3%">FILMALO Y SUBILO A IG</div>
    </div>`;
  app.appendChild(o);
  const cont=$('#ledRec',o); let v=previo||0;
  const t0=performance.now();
  (function anim(now){
    const k=Math.min(1,(now-t0)/1600);
    v=Math.round((previo||0)+(hit.score-(previo||0))*(1-Math.pow(1-k,3)));
    cont.innerHTML=''; const l=led(v,13,'#FFD518');
    l.style.animation='brilla .8s ease-in-out infinite'; cont.appendChild(l);
    if(k<1)requestAnimationFrame(anim); else papeles();
  })(t0);
  setTimeout(()=>{o.remove();S.ocupado=false;},T.recordCierra);

/* ────────── entrada de datos ────────── */
function aplicarEstado(e,deCache){
  if(!e)return;
  /* Si el TV Box se reinicia a las 2 AM sin WiFi, antes arrancaba en blanco
     y parecía que no había jugado nadie. Ahora recupera lo último que vio. */
  if(!deCache){ try{ localStorage.setItem('bp_estado',JSON.stringify({e:e,ts:Date.now()})); }catch(x){} }
  S.rk.noche=e.noche||[]; S.rk.mujeres=e.mujeres||[]; S.rk.historico=e.historico||[];
  if(e.record)S.record={score:e.record.score||0,nombre:e.record.nombre||null};
  if(typeof e.piñas==='number')S.piñas=e.piñas;
  else if(typeof e.pinasHoy==='number')S.piñas=e.pinasHoy;
  pintarRecord(); pintarRanking(); pintarLema();
}
function llegaGolpe(g){
  const previo=S.record.score;
  S.ultimo={nombre:g.nombre,ig:g.ig,score:g.score,ctx:g.ctx}; S.ultimoTs=Date.now();
  S.piñas++;
  pintarTicker();
  if(g.esRecord||(g.score&&g.score>previo)){
    S.record={score:g.score,nombre:g.nombre};
    overRecord(g,previo);
  }else{
    const lista=S.rk.noche;
    const pos=[...lista,{score:g.score,id:'x'}].sort((a,b)=>b.score-a.score).findIndex(x=>x.id==='x')+1;
    const ultimo=lista.length?lista[lista.length-1].score:0;
    overRevancha(g,pos<=5?pos:0,Math.max(1,ultimo-g.score+1));
  }
}

/* ────────── conexión al servidor ────────── */
function conectar(){
  if(typeof EventSource==='undefined')return pollear();
  let es=null,intentos=0,vivo=true;
  const abrir=()=>{
    if(!vivo)return;
    try{es=new EventSource((CFG.API||'')+'/api/stream');}catch(e){return reintentar();}
    es.onopen=()=>{intentos=0;S.conexion='vivo';};
    es.addEventListener('estado',ev=>{try{aplicarEstado(JSON.parse(ev.data));}catch(e){}});
    es.addEventListener('golpe', ev=>{try{llegaGolpe(JSON.parse(ev.data));}catch(e){}});
    es.addEventListener('record',ev=>{try{llegaGolpe({...JSON.parse(ev.data),esRecord:true});}catch(e){}});
    es.onerror=()=>{try{es.close();}catch(e){} reintentar();};
  };
  const reintentar=()=>{
    if(!vivo)return; S.conexion='reintentando';
    setTimeout(abrir,Math.min(30000,1000*Math.pow(2,Math.min(intentos++,5))));
  };
  abrir();
}
function pollear(){
  const traer=()=>fetch((CFG.API||'')+'/api/estado').then(r=>r.json()).then(aplicarEstado).catch(()=>{});
  traer(); setInterval(traer,15000);
}
/* Primero lo último guardado (instantáneo), después lo real del server. */
try{
  const c=JSON.parse(localStorage.getItem('bp_estado')||'null');
  /* Si es de otra noche no sirve: mostraría un ranking viejo como si fuera de hoy. */
  if(c&&c.e&&(Date.now()-c.ts)<10*3600e3) aplicarEstado(c.e,true);
}catch(x){}
fetch((CFG.API||'')+'/api/estado').then(r=>r.json()).then(function(e){aplicarEstado(e);}).catch(()=>{});
conectar();

/* ────────── primer pintado ────────── */
pintarTabs(); pintarRecord(); pintarRanking(); pintarCard(); pintarQR(); pintarTicker();
window.addEventListener('resize',()=>{pintarQR();});
